gebot muss Tucker liefern, was für eine fundierte Investitionsentscheidung nötig ist: eine Budgetschätzung und Angebotsunterlagen aus dem Scoping, eine Budgetspanne mit TCO-Vergleich, einen Rolloutplan mit Pilotwerk und Wellen innerhalb der 24-Monats-Roadmap (Onboarding 2 Monate, Build 10, Test 7, Schulung 2, Cutover 3) und eine abgestimmte Sicht auf den Nutzen. Heatmaps und Scoping sind die Grundlage; TCO-Zahlen, Wertbeitrag und Rollout-Reihenfolge stehen noch aus."}, "pages": {"landscape": {"title": "Systemlandschaft (Referenz): 38 Systeme an vier Werken", "short": "Landschaft", "sub": "Die Referenzansicht: wo jedes System läuft und was die Dokumente dazu sagen. Die Aufteilung in <strong>15</strong> Kern, <strong>7</strong> offen und <strong>16</strong> bleiben ist eine Lesart des Inventars und zweier neuerer Listen, keine Entscheidung. <strong>14</strong> Systeme haben kein markiertes Werk und erscheinen an jedem Werk.", "tile": "38 Systeme: 15 Kern, 7 offen, 16 bleiben. XPPS hat über 30 Schnittstellen und keine aktiven Entwickler. 14 Systeme haben kein markiertes Werk.", "tileFoot": "4 Werke · 13 Prozessbereiche · Referenz", "sources": "Quellen: Systemlandschaft für CSA, Auswahlplan (Okt. 2026); Notizen zur Werksbegehung (12. Okt. 2026); IT-Landschaftsübersicht (Sep. 2026). Die Einstufung ist eine Lesart der Spalte zur künftigen Landschaft im Inventar, keine bestätigte Entscheidung."}, "process": {"title": "Linden ist das Rückgrat: zentraler Lager-, Verpackungs- und Versandpunkt", "short": "Prozessrückgrat", "sub": "Ein Auftrag kann durch bis zu vier Werke laufen, aber Linden ist der zentrale Versandpunkt: Ware kommt auf drei Wegen an, wird gegen 17 Etikettenvarianten verpackt und verlässt Linden über eine gescannte Rampe. Die Werksnotizen verlangen einen schrittweisen Rollout mit Pilotwerk; die Roadmap zeigt einen Cutover.", "tile": "9 Schritte in 6 Phasen, mit den offenen Rollout- und Umsetzungsfragen an jedem Schritt. Alle 5 hoch bewerteten Schnittstellen und Anpassungen liegen in Lager und Verpackung.", "tileFoot": "9 Schritte · 6 Phasen · 4 Werke", "sources": "Quellen: Notizen zur Werksbegehung (12. Okt. 2026); Systemlandschaft für CSA, Schnittstellen- und Prozessliste, Auswahlplan (Okt. 2026); Präsentation zum Engage Workshop (für den 26. Okt. 2026); Präsentation zu den ERP-Treibern (23. Sep. 2026)."}, "valueCompany": {"title": "Vier Werke mit vier unterschiedlichen Aufgaben: was wir vor den Heatmaps wissen", "short": "Wert je Werk", "sub": "Linden (350 Mitarbeitende) versendet für die Gruppe, die Metall- und Kunststoffwerke fertigen die Teile, und Werk 5 baut Bolzenschweißgeräte mit Service und Ersatzteilen. Umsatz und Mitarbeiterzahl weichen zwischen den Dokumenten noch ab, daher trägt jede Zahl ihre Quelle.", "tile": "Vier Werke, vier Muster. 869 Mitarbeitende laut Werksliste (rund 1.500 laut Organisationsübersicht) und 489,95 Mio. € Umsatz 2019. Heatmaps fällig am Di 20. Okt.", "tileFoot": "4 Werke · 6 Basiszahlen", "sources": "Quellen: Account Plan (5. Aug. 2026), Abschluss 2019 wie dort zusammengefasst; IT-Landschaftsübersicht (Sep. 2026) für die Werksumsätze; Einführungspräsentation zu Tucker; Auswahlplan, Organisationsübersicht (Okt. 2026); Präsentation zu den ERP-Treibern (23. Sep. 2026); Notizen zur Werksbegehung (12. Okt. 2026); Heatmap-Vorlage."}, "valueSites": {"title": "Heatmaps je Werk", "short": "Heatmaps", "pending": "Wartet auf die ausgefüllten Werte-Heatmaps. Es liegen nur leere Vorlagen vor; Tucker gibt sie am Di 20. Okt. 2026 an Infor zurück und geht sie anschließend mit Tucker durch.", "tile": "", "tileFoot": "fällig Di 20. Okt", "sub": "", "sources": "Quellen: noch keine."}, "fit": {"title": "Passung und Prioritäten", "short": "Passung", "pending": "Wartet auf Infors bewertete Antwort auf Tuckers Anforderungen.", "tile": "", "tileFoot": "offen", "sub": "", "sources": "Quellen: noch keine."}, "next": {"title": "Entscheidungskalender: von den Heatmaps am 20. Okt. bis zum Rat Mitte/Ende November", "short": "Entscheidungskalender", "sub": "Die Werksbegehung ist erledigt, und die Heatmaps sind am Di 20. Okt zurück fällig, um sie mit Tucker durchzugehen. 19 Einträge sind zur Prüfung markiert: 14 Systeme, 2 Zahlen und 3 Einträge im Zeitplan. Das Scoping läuft vom 26. bis 28. Okt., und die Ergebnispräsentation mit Budgetschätzung und Angebotsunterlagen ist für den 17.–25. Nov. geplant, vor dem Rat Mitte bis Ende November. <strong>5</strong> Punkte sind offen, 3 liegen nur teilweise vor.", "tile": "Heatmaps fällig 20. Okt., Scoping 26.–28. Okt., Ergebnisse 17.–25. Nov., Rat Mitte bis Ende November. 11 Maßnahmen, angeführt von Durchsprache und Rollout-Reihenfolge.", "tileFoot": "13 Punkte · 11 Maßnahmen · Ergebnisse 17.–25. Nov.", "sources": "Quellen: Auswahlprozess-Plan (Okt. 2026); Präsentation zum Engage Workshop (für den 26. Okt. 2026); Notizen zur Werksbegehung (12. Okt. 2026); Account Plan (5. Aug. 2026); Vorbereitungsnotizen (15. Sep. 2026).", "purpose": "Das Angebot muss Tucker liefern, was für eine fundierte Investitionsentscheidung nötig ist: eine Budgetschätzung und Angebotsunterlagen aus dem Scoping, eine Budgetspanne mit TCO-Vergleich, einen Rolloutplan mit Pilotwerk und Wellen innerhalb der 24-Monats-Roadmap (Onboarding 2 Monate, Build 10, Test 7, Schulung 2, Cutover 3) und eine abgestimmte Sicht auf den Nutzen. Heatmaps und Scoping sind die Grundlage; TCO-Zahlen, Wertbeitrag und Rollout-Reihenfolge stehen noch aus."}}, "sizing": {"page": {"title": "Umfang und Aufwand nach Paketen: was die Schätzung abdecken muss", "short": "Umfang & Aufwand", "sub": "Tucker hat 98 von 176 Infor-Prozessen als relevant für das Scoping bewertet, weitere 7 sind erforderlich und 9 noch zu prüfen. Darum liegen sechs Core-Plus-Module, 15 nach Komplexität bewertete Schnittstellen und 6 Anpassungen sowie die noch nicht bemessene Datenmigration.", "tile": "Core: 98 relevante und 7 erforderliche Prozesse. Core Plus: 6 Module. Add-ons: 15 Schnittstellen, 6 Anpassungen, 3 noch zu prüfen und die noch nicht bemessene Datenmigration.", "tileFoot": "3 Pakete · 9 Aufwandstreiber", "sources": "Quellen: Auswahlplan, Prozessliste, Schnittstellenliste und Organisationsübersicht (Okt. 2026); Notizen zur Werksbegehung (12. Okt. 2026); Präsentation zum Engage Workshop (für den 26. Okt. 2026)."}, "labels": {"pkg": "01 · DREI PAKETE", "drv": "02 · AUFWANDSTREIBER", "ifc": "03 · SCHNITTSTELLEN, NACH KOMPLEXITÄT BEWERTET", "adp": "04 · MÖGLICHE ANPASSUNGEN", "c_driver": "TREIBER", "c_docs": "WAS DIE DOKUMENTE SAGEN", "c_src": "QUELLE", "c_state": "STAND", "c_if": "SCHNITTSTELLE", "c_topic": "THEMA", "c_plant": "WERK", "c_cx": "KOMPLEXITÄT", "c_note": "HINWEIS", "confirmed": "bestätigt", "open_": "offen", "none": "—"}, "packages": [{"n": "98 + 7", "l": "CORE · RELEVANTE + ERFORDERLICHE PROZESSE", "items": ["Tucker hat 176 Infor-Prozesse bewertet: 98 relevant, 7 erforderlich aber nicht im Detail gezeigt, 9 zu prüfen und 62 nicht relevant oder nicht Infor (58 nicht relevant, 4 nicht Infor, falls ZWF bleibt).", "Die Scoping-Agenda umfasst 9 End-to-End-Prozesse.", "15 von 38 Systemen sind als Kern eingestuft, darunter XPPS, das abgelöst wird.", "Die meisten relevanten Prozesse liegen in Finanzen (23), Einkauf (22), Planung (16) und Order to Cash (11)."]}, {"n": "6", "l": "CORE PLUS · GENANNTE MODULE", "items": ["Factory Track, Teil von Plan to Deliver; 5 Planungs- und MES-Prozesse sind wegen Hydra als nicht relevant bewertet.", "Automotive Exchange, Teil von Order to Cash.", "BIRST; das Inventar ordnet Aruba FTIS PST und Snowflake zu.", "EPM.", "Supplier Exchange, Teil von Procure to Pay; die Prozessliste sagt, es löse Supply Plus ab.", "Atlas, Zoll und Sanktionsliste mit Partner ZWF (Remote-Termin)."]}, {"n": "15 + 6", "l": "ADD-ONS · SCHNITTSTELLEN + ANPASSUNGEN", "items": ["15 Schnittstellen: 1 niedrig, 11 mittel, 3 hoch.", "6 mögliche Anpassungen: 3 mittel, 2 hoch, 1 nicht bewertet; 3 weitere noch zu prüfen.", "Datenmigration: noch nicht bemessen.", "Technische Themen: Workflow, Formulare, Dokumentenmanagement und IOS."]}], "drivers": [{"d": "Werke", "v": "4: Werk 1, Werk 2, Werk 3&4 (Linden) und Werk 5", "s": "Notizen zur Werksbegehung, Organisationsübersicht", "ok": false, "note": "Der Besuchsplan nennt 3 Werke und der Account Plan drei; die Notizen und die Organisationsübersicht führen vier auf."}, {"d": "ERP-Anwender", "v": "400 XPPS-Lizenzen heute; 700–800 ERP-Anwender erwartet", "s": "Organisationsübersicht, Kundenangabe vom 2. Jul. 2026", "ok": false, "note": "Ob die künftige Zahl benannte Anwender oder Lizenzen zählt, ist nicht angegeben."}, {"d": "Prozesse", "v": "98 relevant, 7 erforderlich, 9 zu prüfen, 62 nicht relevant oder nicht Infor", "s": "Prozessliste, Auswahlplan", "ok": true, "note": ""}, {"d": "Schnittstellen und Anpassungen", "v": "15 Schnittstellen, 6 Anpassungen, 3 weitere zu prüfen", "s": "Schnittstellenliste, Auswahlplan", "ok": true, "note": "Werk, Systemverantwortung, Datenobjekte und Volumen fehlen meist."}, {"d": "Systeme", "v": "38: 15 Kern, 16 bleiben, 7 offen; 14 ohne Werksmarkierung", "s": "Systeminventar, Schnittstellen- und Prozessliste", "ok": false, "note": "Die Einstufung ist eine Lesart, keine Entscheidung."}, {"d": "Einheiten außerhalb der vier Werke", "v": "Rumänien, England, Marokko und SPIRALock sind aufgeführt", "s": "Organisationsübersicht", "ok": false, "note": "Ob sie im Umfang liegen, ist nicht angegeben."}, {"d": "Datenmigration", "v": "Nicht bemessen; welche XPPS-Daten migriert, archiviert oder neu aufgebaut werden, ist eine offene Frage", "s": "Notizen zur Werksbegehung", "ok": false, "note": ""}, {"d": "Roadmap", "v": "24 Monate: Onboarding 2, Build 10, Test 7, Schulung 2, Cutover 3", "s": "Präsentation zum Engage Workshop", "ok": true, "note": "Ein Cutover; die Werksnotizen empfehlen einen schrittweisen Rollout."}, {"d": "Erfolgskriterien", "v": "Nicht festgelegt; vorgeschlagen: Durchlaufzeit, Klickaufwand, Scanquote, Bestandsgenauigkeit, Fehlerquote und Verfügbarkeit", "s": "Notizen zur Werksbegehung", "ok": false, "note": ""}], "ifcTitle": "SCHNITTSTELLEN", "interfaces": [{"n": "Waagenanbindung", "t": "Stückzahlen aus Waagen beim Verpacken", "p": "—", "cx": "Mittel", "note": "Kein System genannt."}, {"n": "QM – Boehme & Weihs", "t": "Anbindung Qualitätsmanagement", "p": "—", "cx": "Mittel", "note": ""}, {"n": "PLM – Windchill", "t": "Anbindung Windchill", "p": "—", "cx": "Mittel", "note": ""}, {"n": "Catalog Creator", "t": "Produkt- und Kundendaten", "p": "—", "cx": "Mittel", "note": ""}, {"n": "MES und Feinplanung – Hydra", "t": "Anbindung Hydra", "p": "—", "cx": "Mittel", "note": ""}, {"n": "VideoJet", "t": "Polybag-Druck", "p": "—", "cx": "Mittel", "note": ""}, {"n": "Viastore Small Pack WMS", "t": "Anbindung Lagersysteme", "p": "—", "cx": "Hoch", "note": ""}, {"n": "Hänel-Lift", "t": "Anbindung Lagersysteme", "p": "—", "cx": "Mittel", "note": ""}, {"n": "Kardex Lift Systems", "t": "Anbindung Lagersysteme", "p": "—", "cx": "Mittel", "note": ""}, {"n": "Jungheinrich Lift Systems", "t": "Anbindung Lagersysteme", "p": "—", "cx": "Hoch", "note": ""}, {"n": "LOGA 2001", "t": "Verbuchen der Lohn-Sachkontenbuchungen", "p": "—", "cx": "Niedrig", "note": ""}, {"n": "Concur", "t": "Reisekostenabrechnung", "p": "—", "cx": "Mittel", "note": ""}, {"n": "TMS", "t": "Liest die Verpackungsdefinition aus dem Packauftrag; zeigt, wie ein Kunde verpackt haben will", "p": "—", "cx": "Hoch", "note": ""}, {"n": "Tor-Scanner", "t": "Kamera dokumentiert Warenflüsse, liest QA-Codes und RFID-Labels; Scanner lösen Lagerumbuchungen aus", "p": "—", "cx": "Mittel", "note": ""}, {"n": "Konzernreporting Datalake", "t": "Berichte an den Konzern-Datalake", "p": "alle", "cx": "Mittel", "note": ""}], "adaptTitle": "MÖGLICHE ANPASSUNGEN", "adaptations": [{"n": "Rampenverwaltung", "t": "", "p": "3", "cx": "Mittel", "note": ""}, {"n": "Hochregal-Lager Werk 5", "t": "", "p": "5", "cx": "Mittel", "note": ""}, {"n": "Hochregal-Lager Werk 1", "t": "", "p": "1", "cx": "Hoch", "note": ""}, {"n": "Hochregal-Lager Werk 3", "t": "", "p": "3", "cx": "Hoch", "note": ""}, {"n": "Labeldruck", "t": "Für Tuckers eigenes Etikett", "p": "—", "cx": "Mittel", "note": ""}, {"n": "Staplersteuerung für Auslagerungen", "t": "", "p": "5", "cx": "—", "note": "Nicht bewertet."}, {"n": "Speditionsanmeldung", "t": "Noch zu prüfen", "p": "3", "cx": "—", "note": ""}, {"n": "Ladeliste", "t": "Noch zu prüfen", "p": "3", "cx": "—", "note": ""}, {"n": "Etiketten mit Bild", "t": "Noch zu prüfen", "p": "—", "cx": "—", "note": ""}], "foot": "Komplexität wie in der Schnittstellenliste bewertet. Ein Strich bedeutet, dass das Feld leer ist. Die Werksspalte zeigt die Werksnummer aus der Liste."}, "delivery": {"page": {"title": "Umsetzungsrisiko und Rollen: wo der Plan am dünnsten ist", "short": "Risiko & Rollen", "sub": "Der Plan hat eine 24-Monats-Roadmap und die Engage-Methode, aber nur 2 der 14 Prozessstränge haben einen benannten Verantwortlichen, Key User und Change Management sind noch nicht festgelegt, und die Rollout-Reihenfolge ist offen. Acht Risiken folgen, jedes mit seinem Beleg.", "tile": "8 Risiken, jedes mit Beleg. 2 von 14 Prozesssträngen haben einen benannten Verantwortlichen; Key User und Change Management sind noch nicht festgelegt.", "tileFoot": "8 Risiken · 14 Prozessstränge", "sources": "Quellen: Governance-Modell und Auswahlplan (Okt. 2026); Notizen zur Werksbegehung (12. Okt. 2026); Präsentation zum Engage Workshop (für den 26. Okt. 2026); Präsentation zu den ERP-Treibern (23. Sep. 2026); IT-Landschaftsübersicht (Sep. 2026)."}, "labels": {"risks": "01 · RISIKEN FÜR DEN PLAN", "streams": "02 · WER JEDEN PROZESSSTRANG VERANTWORTET", "crit": "03 · VORGESCHLAGENE ERFOLGSKRITERIEN", "c_risk": "RISIKO", "c_ev": "BELEG IN DEN DOKUMENTEN", "c_src": "QUELLE", "c_red": "WAS ES VERRINGERN WÜRDE", "c_stream": "PROZESSSTRANG", "c_owner": "VERANTWORTLICHE FUNKTION", "c_sme": "KERN-EXPERTEN (ROLLEN)", "c_e2e": "INFOR-PROZESS", "c_named": "BENANNT", "named": "benannt", "fonly": "nur Funktion"}, "risks": [{"r": "Ein Cutover statt eines gestuften Rollouts", "e": "Die Roadmap hat eine einzige 3-monatige Cutover- und Go-live-Phase in Monat 22–24. Die Werksnotizen bevorzugen eine schrittweise Umstellung je Werk, und das Deck zu den ERP-Treibern beginnt mit Finanzen und den weniger komplexen Bereichen.", "s": "Präsentation zum Engage Workshop; Notizen zur Werksbegehung; Präsentation zu den ERP-Treibern", "m": "Pilotwerk und Rollout-Wellen nach Komplexität, Nutzen, Risiko und Abhängigkeiten bestimmen und in der Roadmap zeigen (Notizen, Schritt 5)."}, {"r": "Die Intralogistik ist der schwerste Teil", "e": "Alle 5 hoch bewerteten Schnittstellen und Anpassungen liegen in Lager und Verpackung; 17 Etikettenvarianten; 24/7-Betrieb; Scanner, RFID und Waagen eng gekoppelt.", "s": "Schnittstellenliste; Notizen zur Werksbegehung", "m": "Ein Proof of Concept für Scanner- und Verpackungsprozesse, Maschinenintegration, Chargenverfolgung und EDI (Notizen, Schritt 6)."}, {"r": "XPPS fällt aus, bevor es abgelöst ist", "e": "Das Deck zu den ERP-Treibern bewertet das Risiko, das Projekt nicht durchzuführen, mit Schweregrad sehr hoch und Wahrscheinlichkeit hoch: mehr Anwendungsfehler mit längeren Ausfällen, Strafzahlungen und Reputationsschäden. Rund 20 Automobilhersteller hängen am Werk, mit Strafzahlungen von rund 50 Mio. $ pro Tag; XPPS hat keine aktiven Entwickler und keine modernen Schnittstellen.", "s": "Präsentation zu den ERP-Treibern; IT-Landschaftsübersicht", "m": "Die Dokumente beschreiben keinen Kontinuitätsplan für XPPS während des Projekts. Das ist eine Lücke."}, {"r": "Umfang und Daten sind nicht geklärt", "e": "14 Systeme haben keine Werksmarkierung; vier Umsatzzahlen und mehrere Mitarbeiterzahlen widersprechen sich; 3 gegenüber 4 Werken.", "s": "Systeminventar; Account Plan; Organisationsübersicht", "m": "In der Heatmap-Durchsprache klären; Zielorganisation für Werke, Lager und zentrale Funktionen festlegen (Notizen, Schritt 1)."}, {"r": "Noch kein Plan für Change Management und Key User", "e": "Die Zeile Change Management im Auswahlplan ist leer, Key User je Gesellschaft sind nicht eingetragen. Die Engage-Methode bietet organisatorisches Change Management, Key-User-Training und Train-the-Trainer.", "s": "Auswahlplan; Organisationsübersicht; Präsentation zum Engage Workshop", "m": "Verantwortliche und Key User für die 14 Stränge benennen und den Change-Ansatz vor der Schätzung festlegen."}, {"r": "Schnittstellenvolumen", "e": "15 Schnittstellen und 6 Anpassungen sind bewertet, 3 weitere zu prüfen, 3 Schnittstellen sind hoch bewertet, und Werksspalte, Systemverantwortung, Datenobjekte und Volumen sind meist leer.", "s": "Schnittstellenliste; Notizen zur Werksbegehung", "m": "Die Schnittstellenliste mit Systemverantwortung, Datenobjekten, Volumen, Frequenz und Kritikalität vervollständigen (Notizen, Schritt 3)."}, {"r": "Umfangsgrenzen", "e": "Rumänien, England, Marokko und SPIRALock sind ohne Entscheidung aufgeführt; alle Werke liegen heute unter einem Buchungskreis; zentrale gegenüber werksbezogenen Prozessen sind offen.", "s": "Organisationsübersicht; Notizen zur Werksbegehung", "m": "Klären, was im Umfang liegt und welche Prozesse zentral in Linden bleiben."}, {"r": "Das Entscheidungsfenster ist kurz", "e": "Die Ergebnisse sind für den 17.–25. Nov. geplant, und der Rat tagt Mitte bis Ende November.", "s": "Auswahlplan; Vorbereitungsnotizen", "m": "Schätzung, Wertbeitrag und Umsetzungsplan in diesem Fenster bereithalten."}], "streams": [{"s": "1. Customer & Order Management", "o": "Vertrieb / Kundenservice", "sme": "Customer Service, Sales, Pricing, Customer EDI", "e2e": "Market to Order, Order to Cash", "named": false}, {"s": "2. Demand & Supply Planning", "o": "Supply Chain", "sme": "Demand Planner, MRP, Production Planning, Capacity Planning", "e2e": "Plan to Deliver (Planung, MRP)", "named": false}, {"s": "3. Procurement & Supplier Management", "o": "Einkauf", "sme": "Buyer, Strategic Procurement, Supplier Scheduling, Supplier Quality", "e2e": "Procure to Pay", "named": false}, {"s": "4. Manufacturing", "o": "Produktion", "sme": "Production, Shopfloor, Manufacturing Engineering, Production Control", "e2e": "Plan to Deliver (Shopfloor)", "named": false}, {"s": "5. Engineering & Product Data", "o": "Engineering", "sme": "BOM, Routing, Product Engineering, Change Management", "e2e": "Design to Release", "named": false}, {"s": "6. Warehouse & Internal Logistics", "o": "Logistik", "sme": "Goods Receipt, Warehouse, Line Feeding, Inventory", "e2e": "Procure to Pay, Plan to Deliver", "named": false}, {"s": "7. Shipping & Customer Logistics", "o": "Logistik", "sme": "Shipping, Packaging, Transport, ASN/JIT/JIS", "e2e": "Order to Cash", "named": false}, {"s": "8. Quality Management", "o": "Qualität", "sme": "Incoming, Production, Customer & Supplier Quality, APQP/PPAP", "e2e": "Issue to Resolution", "named": false}, {"s": "9. Finance", "o": "Finanzen", "sme": "GL, AP, AR, Assets, Tax, Closing", "e2e": "Financial Plan to Report (Finanzen)", "named": false}, {"s": "10. Controlling & Costing", "o": "Controlling", "sme": "Product Costing, Production Controlling, Inventory Valuation", "e2e": "Financial Plan to Report (Kostenrechnung)", "named": false}, {"s": "11. Maintenance / Asset Management", "o": "Technik / Instandhaltung", "sme": "Maintenance, Equipment, Spare Parts", "e2e": "Service to Cash", "named": false}, {"s": "12. Master Data & Reporting", "o": "Fachbereich / Finanzen", "sme": "Material, Customer, Supplier, BI/KPI, Governance", "e2e": "Mehrere", "named": false}, {"s": "13. Projektabwicklung – Vorserie bis SOP (Leiter F&E)", "o": "—", "sme": "—", "e2e": "Contract to Cash", "named": true}, {"s": "14. Atlas / Zoll / Sanktionsliste", "o": "—", "sme": "—", "e2e": "Order to Cash und Procure to Pay", "named": true}], "streamsFoot": "2 der 14 Stränge haben einen benannten Verantwortlichen (13 und 14); die Stränge 1–12 nennen die verantwortliche Funktion und ihre Kern-Experten als Rollen, nicht als Personen. Die Stränge 2, 10 und 13 haben im Inventar kein eigenes System.", "criteria": ["Durchlaufzeit", "Klickaufwand", "Scanquote", "Bestandsgenauigkeit", "Fehlerquote", "Verfügbarkeit"], "criteriaLede": "Die Notizen zur Werksbegehung schlagen diese Erfolgskriterien für den Rollout vor. Für keines ist bisher ein Zielwert festgelegt."}};

SITE.page = function(k){ return SITE.PAGES.filter(function(p){ return p.k === k; })[0]; };

/* ---- small helpers shared by every view ---- */
SITE.esc = function(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
SITE.poss = function(t){ t = String(t == null ? '' : t); return SITE.esc(t) + (/s$/i.test(t) ? '&rsquo;' : '&rsquo;s'); };
SITE.fmt = function(v){ return Number(v).toLocaleString('en-GB'); };
SITE.pct = function(a, b){ return b ? (100 * a / b).toFixed(1) + '%' : '—'; };
SITE.slug = (SITE.data.meta.client || 'site').toLowerCase().replace(/[^a-z0-9]+/g, '-');
SITE.site = function(k){ return SITE.data.sites.filter(function(s){ return s.key === k; })[0] || {key:k, label:k, short:k}; };
SITE.siteShort = function(k){ var s = SITE.site(k); return s.short || s.label; };
SITE.area = function(k){ return SITE.data.areas.filter(function(a){ return a.key === k; })[0] || {key:k, code:'', title:k}; };
SITE.areaLabel = function(k){ var a = SITE.area(k); return (a.code ? a.code + ' · ' : '') + a.title; };
SITE.statusLabel = function(s){ return SITE.data.labels.status[s] || s; };
SITE.findSystem = function(name, site, area){
  return SITE.data.systems.filter(function(d){
    return d.name === name && (!site || d.site === site) && (!area || d.area === area);
  })[0];
};
// Turn a page key ("fit", "process#demand") or a file name into a link.
SITE.href = function(h){
  if(!h) return '';
  var m = /^([A-Za-z]+)(#.*)?$/.exec(h), p = m && SITE.page(m[1]);
  return p ? p.href + (m[2] || '') : h;
};

    '</nav>';

/* ---- previous / next view, at the foot of every page ---- */
SITE.renderPageLinks = function(currentKey){
  var slot = document.getElementById('pageLinks');
  if(!slot) return;
  var i = SITE.PAGES.map(function(p){ return p.k; }).indexOf(currentKey);
  var prev = SITE.PAGES[i - 1], next = SITE.PAGES[i + 1];
  var link = function(p, dir){
    if(!p) return '<a class="pg ' + dir + '" href="index.html"><span class="pg-d">' + (dir === 'prev' ? '&larr; ' : '') + 'Start' + (dir === 'next' ? ' &rarr;' : '') + '</span><span class="pg-t">Alle sieben Ansichten</span></a>';
    return '<a class="pg ' + dir + '" style="--accent:' + p.accent + '" href="' + p.href + '"><span class="pg-d">' +
      (dir === 'prev' ? '&larr; Zurück' : 'Weiter &rarr;') + '</span><span class="pg-t"><span class="n">' + p.n + '</span>' + p.t + '</span></a>';
  };

};

/* ---- one view: header, footer and links from the data, then the page's own drawing.
   A view marked pending shows what it is waiting for instead; a drawing error shows
   the message rather than a blank page, so a data mistake is easy to find. ---- */
SITE.view = function(k, draw){
  var p = SITE.page(k), M = SITE.data.meta;
  document.title = M.client + ' — ' + p.t.replace(/<[^>]+>/g, '');
  var head = document.getElementById('pagehead');
  if(head) head.innerHTML = '<p class="eyebrow">' + SITE.esc(M.eyebrow) + '</p><h1>' + p.t + '</h1>' +
    (p.sub ? '<p class="sub">' + p.sub + '</p>' : '');
  var foot = document.getElementById('pagefoot');
  if(foot) foot.innerHTML = p.sources;
  SITE.renderPageLinks(k);
  var main = document.getElementById('content');
  if(p.pending){
    if(main) main.innerHTML = '<div class="pending"><span class="pending-k">OFFEN</span><p>' + p.pending + '</p></div>';
    return;
  }
  try { draw(SITE.data); }
  catch(err){
    if(main) main.insertAdjacentHTML('afterbegin', '<div class="pending err"><span class="pending-k">DIESE ANSICHT KONNTE NICHT DARGESTELLT WERDEN</span><p>' +
      SITE.esc(err && err.message || err) + '</p><p>Den Abschnitt dieser Ansicht in site-data.json prüfen und build_site.py erneut ausführen.</p></div>');
    if(window.console) console.error(err);
  }
};

/* ---- folds: long tables a viewer can minimise. SITE.fold(key, title, body, {sum, open, flat})
   returns <details class="ui-fold" data-fold="key">; static markup of the same shape works too.
   sum is shown only while closed, so a minimised table still carries its headline. Each viewer's
   choice is remembered per key on their own device; without one, `open` (default true) applies. ---- */
SITE.fold = function(key, title, body, o){
  o = o || {};
  return '<details class="ui-fold' + (o.flat ? ' flat' : '') + '" data-fold="' + key + '"' + (o.open === false ? '' : ' open') + '>' +
    '<summary><span class="ui-fold-t">' + title + '</span>' + (o.sum ? '<span class="ui-fold-sum">' + o.sum + '</span>' : '') + '</summary>' +
    '<div class="ui-fold-b">' + body + '</div></details>';
};
(function(){
  var key = function(d){ return 'es-fold:' + SITE.slug + ':' + d.dataset.fold; };
  var restore = function(root){
    root.querySelectorAll('details.ui-fold[data-fold]:not([data-fold-on])').forEach(function(d){
      d.setAttribute('data-fold-on', '');
      var v = null;
      try { v = localStorage.getItem(key(d)); } catch(e) {}
      if(v) d.open = v === 'open';
    });
  };
  // Only the viewer's own toggles are remembered, not a page opening a fold for them.
  document.addEventListener('click', function(e){
    var sm = e.target.closest && e.target.closest('details.ui-fold[data-fold] > summary');
    if(!sm) return;
    var d = sm.parentElement;
    setTimeout(function(){ try { localStorage.setItem(key(d), d.open ? 'open' : 'closed'); } catch(err) {} }, 0);
  });
  SITE.foldSaved = function(k){ try { return localStorage.getItem('es-fold:' + SITE.slug + ':' + k); } catch(e) { return null; } };
  restore(document);
  new MutationObserver(function(){ restore(document); }).observe(document.body, {childList:true, subtree:true});
})();

/* ---- "possibly incorrect": a red highlight on a figure or name that opens the reason
   when tapped or clicked. SITE.flag(html, why) wraps html; with no why it returns html as is. ---- */
SITE.flag = function(html, why){
  if(!why) return html;
  return '<span class="ui-flag" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false" data-why="' + SITE.esc(why) + '">' + html +
    '<i aria-hidden="true">!</i><span class="sr-only"> (möglicherweise falsch)</span></span>';
};
(function(){
  var pop = null, from = null;
  var close = function(){
    if(pop){ pop.remove(); pop = null; }
    if(from){ from.setAttribute('aria-expanded', 'false'); from = null; }
  };
  var open = function(el){
    close();
    from = el; el.setAttribute('aria-expanded', 'true');
    pop = document.createElement('div');
    pop.className = 'ui-flag-pop';
    pop.setAttribute('role', 'dialog');
    pop.setAttribute('aria-label', 'Warum das falsch sein kann');
    pop.innerHTML = '<div class="h">MÖGLICHERWEISE FALSCH<button type="button" class="x" aria-label="Schließen">&times;</button></div><p></p>';
    pop.querySelector('p').textContent = el.dataset.why;
    document.body.appendChild(pop);
    var r = el.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    var left = Math.max(16, Math.min(r.left, vw - pop.offsetWidth - 16));
    var top = r.bottom + 8;
    if(top + pop.offsetHeight > window.innerHeight - 8 && r.top - pop.offsetHeight - 8 > 8) top = r.top - pop.offsetHeight - 8;
    pop.style.left = (left + window.scrollX) + 'px';
    pop.style.top = (top + window.scrollY) + 'px';
    pop.querySelector('.x').focus({preventScroll:true});
  };
  // Capture phase, so a flag inside a clickable card opens its reason rather than the card.
  document.addEventListener('click', function(e){
    var f = e.target.closest('.ui-flag');
    if(f){ e.preventDefault(); e.stopPropagation(); if(from === f) close(); else open(f); return; }
    if(!pop) return;
    if(e.target.closest('.ui-flag-pop .x') || !e.target.closest('.ui-flag-pop')) close();
  }, true);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && pop){ var f0 = from; close(); if(f0) f0.focus(); e.stopPropagation(); return; }
    var f = e.target.closest && e.target.closest('.ui-flag');
    if(f && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); e.stopPropagation(); open(f); }
  }, true);
  window.addEventListener('resize', close);
  document.addEventListener('scroll', function(e){ if(pop && !pop.contains(e.target)) close(); }, true);
})();

SITE.flowStepsFor = function(name, site){

    return all.indexOf(name) >= 0;
  });

/* ---- heat-map lookups (rendered on 04, linked from every system card) ---- */
SITE.HM_LVL = {R:'TOP', O:'MED', G:'STRENGTH'};
SITE.hmSite = function(k){ return SITE.data.valueSites.sites.filter(function(s){ return s.site === k; })[0]; };
SITE.hmHref = function(site, id){ return '04-value-sites.html#hm-' + site + '-' + id; };
// Systems at a site, as patterns that find them in a heat map's "tool used today" text.
SITE.hmPatterns = (function(){
  var cache = {};
  var reEsc = function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
  return function(site){
    if(cache[site]) return cache[site];
    var list = [];
    SITE.data.systems.filter(function(d){ return d.site === site; }).forEach(function(d){
      [d.name].concat(d.aliases || []).forEach(function(n){ list.push([n, d.name]); });
    });
    list.sort(function(a, b){ return b[0].length - a[0].length; });
    return (cache[site] = list.map(function(x){ return [new RegExp('(^|[^A-Za-z0-9])(' + reEsc(x[0]) + ')(?![A-Za-z0-9])', 'gi'), x[1]]; }));
  };
})();
SITE.hmToolHtml = function(tool, site){
  if(!tool) return '<span style="opacity:.55">&mdash;</span>';
  var out = String(tool).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  var hits = [];
  SITE.hmPatterns(site).forEach(function(p){
    out = out.replace(p[0], function(m, pre, word){ hits.push([p[1], word]); return pre + '\u0000' + (hits.length - 1) + '\u0000'; });
  });
  return out.replace(/\u0000(\d+)\u0000/g, function(_, i){
    return '<span class="hm-sys" data-sys="' + SITE.esc(hits[i][0]) + '" data-site="' + site + '">' + hits[i][1] + '</span>';
  });
};
SITE.hmRowsForSystem = function(name, site){
  var st = SITE.hmSite(site), rows = [];
  if(!st) return rows;
  var pats = SITE.hmPatterns(site).filter(function(p){ return p[1] === name; })
    .map(function(p){ return new RegExp(p[0].source, 'i'); });
  (st.areas || []).forEach(function(a){ (a.groups || []).forEach(function(g){ (g.rows || []).forEach(function(r){
    if(r[1] && pats.some(function(re){ return re.test(r[1]); })) rows.push({area:a.title, id:a.id, task:r[0], tool:r[1], heat:r[2] || ''});
  }); }); });
  return rows;
};

/* ---- light / dark theme: follows the OS until the toggle is used ---- */
SITE.initTheme = function(){
  var root = document.documentElement, btn = document.getElementById('themeToggle');
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  var saved = null;
  try { saved = localStorage.getItem('es-theme'); } catch(e) {}
  if(saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  if(!btn) return;
  var current = function(){ return root.getAttribute('data-theme') || (mq.matches ? 'light' : 'dark'); };
  var paint = function(){ btn.innerHTML = current() === 'dark' ? '&#9788;<span class="tt"> Hellmodus</span>' : '&#9790;<span class="tt"> Dunkelmodus</span>'; };
  btn.addEventListener('click', function(){
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('es-theme', next); } catch(e) {}
    paint();
  });
  if(mq.addEventListener) mq.addEventListener('change', paint);
  paint();
};

/* ---- keyboard access for click-only controls ----
   Cards, chips, tabs and diagram nodes are divs, spans or SVG groups with delegated
   click handlers. Make each one focusable, give it a button role and its selected
   state, and let Enter/Space fire the same click. Runs again whenever a page
   re-renders, so controls drawn later are covered too. */
(function(){
  var SEL = '.card, .chip, .target-tab, .fg-card, .hm-sys[data-sys], .val-ins .go, g.node';
  var NATIVE = 'a, button, input, select, textarea, summary';
  var pressed = function(el){
    return el.matches('.chip.site') ? !el.classList.contains('inactive')
         : el.matches('.chip, .target-tab') ? el.classList.contains('active') : null;
  };
  function enhance(){
    document.querySelectorAll(SEL).forEach(function(el){
      if(el.matches(NATIVE)) return;
      if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
      if(!el.hasAttribute('role')) el.setAttribute('role', 'button');
      if(el instanceof SVGElement && !el.hasAttribute('aria-label'))
        el.setAttribute('aria-label', el.textContent.trim().replace(/\s+/g, ' '));
      var p = pressed(el);
      if(p !== null && el.getAttribute('aria-pressed') !== String(p)) el.setAttribute('aria-pressed', p);
    });
  }
  var queued = false;
  var later = function(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; enhance(); }); };
  new MutationObserver(later).observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['class']});
  enhance();
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target;
    if(!(el instanceof Element) || el.matches(NATIVE) || !el.matches(SEL)) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent('click', {bubbles:true, cancelable:true}));
  });
})();

/* ---- dialog focus: move focus in on open, keep the page behind it inert, and return
   focus to whatever opened it on close. Watches the overlay's "open" class, so every
   opener (system cards, requirement cards, info pop-ups) gets the same behaviour. ---- */
(function(){
  var m = SITE.modal.el;
  if(!m) return;
  var back = null, active = false;
  new MutationObserver(function(){
    var open = m.classList.contains('open');
    if(open && !active){
      active = true;
      back = document.activeElement;
      Array.prototype.forEach.call(document.body.children, function(c){ if(c !== m && !c.inert){ c.inert = true; c.dataset.uiInert = '1'; } });
      m.querySelector('.modal').scrollTop = 0;
      document.getElementById('swModalClose').focus();
    } else if(!open && active){
      active = false;
      document.querySelectorAll('[data-ui-inert]').forEach(function(c){ c.inert = false; delete c.dataset.uiInert; });
      if(back && document.contains(back) && back.focus) back.focus();
      back = null;
    }
  }).observe(m, {attributes:true, attributeFilter:['class']});
})();

/* ---- scroll cues for wide tables: a hint line and an edge shadow while there is
   more to the right, gone once the table fits or is scrolled to the end ---- */
(function(){
  function cue(w){
    if(!w.previousElementSibling || !w.previousElementSibling.classList.contains('scroll-hint')){
      var h = document.createElement('p');
      h.className = 'scroll-hint';
      h.textContent = 'Breiter als der Bildschirm. Tabelle seitlich wischen oder scrollen →';
      w.parentNode.insertBefore(h, w);
      w.addEventListener('scroll', function(){ update(w); }, {passive:true});
    }
    update(w);
  }
  function update(w){
    var can = w.scrollWidth > w.clientWidth + 1;
    w.classList.toggle('can-scroll', can);
    w.classList.toggle('at-end', !can || w.scrollLeft + w.clientWidth >= w.scrollWidth - 2);
    w.previousElementSibling.classList.toggle('show', can);
  }
  var all = function(){ document.querySelectorAll('.val-table-wrap').forEach(cue); };
  var q = false;
  var later = function(){ if(q) return; q = true; requestAnimationFrame(function(){ q = false; all(); }); };
  new MutationObserver(later).observe(document.body, {childList:true, subtree:true});
  window.addEventListener('resize', later);
  all();
})();

  const esc = SITE.esc, L = D.landscape, SYS = D.systems;
  const STATUS = ['core', 'extended', 'stays'];
  const STATUS_COLOR = {core:'var(--core)', extended:'var(--extended)', stays:'var(--stays)'};

  // ---- controls ----
  document.getElementById('statusChips').innerHTML =
    `<div class="chip active" data-status="all"><span class="dot" style="background:var(--text-dim)"></span>Alle Systeme</div>` +
    STATUS.map(s => `<div class="chip" data-status="${s}"><span class="dot" style="background:${STATUS_COLOR[s]}"></span>${esc(SITE.statusLabel(s))}</div>`).join('');
  document.getElementById('siteChips').innerHTML =
    D.sites.map(s => `<div class="chip site" data-site-toggle="${s.key}">${esc(s.short || s.label)}</div>`).join('');

  // ---- headline numbers ----
  const counts = {core:0, extended:0, stays:0};
  SYS.forEach(d => counts[d.status]++);
  document.getElementById('stats').innerHTML =
    `<div class="stat"><div class="n">${SYS.length}</div><div class="l">SYSTEME ERFASST</div></div>` +
    STATUS.map(s => `<div class="stat ${s}"><div class="n">${counts[s]}</div><div class="l">${esc(SITE.statusLabel(s)).toUpperCase()}</div></div>`).join('');

  // Tools a site's heat map names that the landscape doesn't: shown on yellow, never counted.
  const HM_ONLY = D.valueSites.sites.flatMap(st => (st.extra || []).map((x, i) => Object.assign({site:st.site, i}, x)));

  document.getElementById('legendNote').innerHTML =
    `<span class="badge-oos" style="display:inline-block;position:relative;top:-1px;"></span> außer Support &nbsp;&middot;&nbsp; ` +
    `<span class="badge-ext" style="position:relative;top:-1px;">ext</span> externe Schnittstelle &nbsp;&middot;&nbsp; ` +
    `<span class="flag-key"><span class="ui-flag" style="cursor:default;pointer-events:none;">Name<i aria-hidden="true">!</i></span> möglicherweise falsch, wie erfasst</span>` +
    (HM_ONLY.length ? ` &nbsp;&middot;&nbsp; <span class="hm-only-key"></span> nur in der Heatmap eines Werks genannt, nicht mitgezählt` : '') +
    `. Jede Karte öffnet Stärken, Schwächen und die zugrunde liegenden Belege des Systems.` +
    (L.legendNote ? ' ' + L.legendNote : '');

  // ---- process areas, one column per site ----
  const NOTES = L.siteNotes || {};
  function cardHtml(d){
    return `
      <div class="card" data-status="${d.status}" data-site="${d.site}" data-name="${esc(d.name)}" data-area="${d.area}" title="Stärken, Schwächen und Belege">
        <div class="name">${SITE.flag(esc(d.name), d.flag)}${d.oos ? '<span class="badge-oos" title="Bereits außer Support"></span>' : ''}${d.ext ? '<span class="badge-ext">ext</span>' : ''}</div>
        <div class="desc">${esc(d.desc)}</div>
      </div>`;
  }
  function hmOnlyCardHtml(x){
    return `
      <button type="button" class="hm-card" data-site="${x.site}" data-hm-only="${x.site}:${x.i}" title="Nur in der Heatmap von ${esc(SITE.site(x.site).label)} genannt">
        <span class="name">${esc(x.name)}<span class="badge-hm">heat map</span></span>
        <span class="desc">${esc(x.job)}</span>
      </button>`;
  }
  function areaSummary(items){
    const n = s => items.filter(d => d.status === s).length;
    const oos = items.filter(d => d.oos).length;
    return [`${items.length} ${items.length === 1 ? 'System' : 'Systeme'}`,
            n('core') ? `<b class="c">${n('core')} Kern</b>` : '',
            n('extended') ? `<b class="e">${n('extended')} erweitert</b>` : '',
            n('stays') ? `${n('stays')} bleiben` : '',
            oos ? `<b class="o">${oos} außer Support</b>` : ''].filter(Boolean).join(' &middot; ');
  }
  const container = document.getElementById('areas');
  D.areas.forEach(area => {
    const items = SYS.filter(d => d.area === area.key);
    const extra = HM_ONLY.filter(x => x.area === area.key);
    if(!items.length && !extra.length) return;
    const sec = document.createElement('div');
    sec.className = 'area';
    sec.innerHTML = `
      <div class="area-head">
        ${area.code ? `<span class="area-code">${esc(area.code)}</span>` : ''}
        <span class="area-title">${esc(area.title)}</span>
        <span class="area-desc">${area.desc ? esc(area.desc) + ' &middot; ' : ''}${areaSummary(items)}${extra.length ? ` &middot; <b class="h">+${extra.length} aus Heatmaps</b>` : ''}</span>
      </div>
      <div class="site-grid">
        ${D.sites.map(site => {
          const siteItems = items.filter(d => d.site === site.key);
          const siteExtra = extra.filter(x => x.site === site.key);
          const note = NOTES[site.key];
          return `
            <div class="site-col" data-site="${site.key}">
              <div class="site-col-head">${note ? `<button type="button" class="area-info site-info" data-site-info="${site.key}" title="${esc(note.title)}">${esc(site.label)}<span class="ai" aria-hidden="true">i</span></button>` : esc(site.label)}</div>
              <div class="cards">
                ${siteItems.length ? siteItems.map(cardHtml).join('') : siteExtra.length ? '' : '<div class="empty-cell">&mdash; keine &mdash;</div>'}
                ${siteExtra.map(hmOnlyCardHtml).join('')}
                <div class="empty-cell empty-filter">&mdash; keine Treffer &mdash;</div>
              </div>
            </div>`;
        }).join('')}
      </div>`;
    container.appendChild(sec);
  });

  // ---- filters: hide what doesn't match, drop areas with nothing left, say how many show ----
  function applyFilter(){
    const f = document.body.getAttribute('data-filter');
    const hidden = D.sites.filter(s => document.body.classList.contains('hide-' + s.key)).map(s => s.key);
    const match = c => (f === 'all' || c.dataset.status === f) && !hidden.includes(c.dataset.site);
    let shown = 0;
    document.querySelectorAll('#areas .area').forEach(a => {
      let n = 0;
      a.querySelectorAll('.site-col').forEach(col => {
        const cards = [...col.querySelectorAll('.card')];
        const k = cards.filter(match).length;
        col.classList.toggle('filtered-empty', f !== 'all' && cards.length > 0 && k === 0);
        n += k;
      });
      a.classList.toggle('no-match', f !== 'all' && n === 0);
      shown += n;
    });
    document.getElementById('filterCount').innerHTML = (f === 'all' && !hidden.length) ? '' :
      `Angezeigt: <b>${shown}</b> von ${SYS.length} Systemen${f !== 'all' ? ` &middot; ${esc(SITE.statusLabel(f)).toLowerCase()}` : ''}${hidden.length ? ` &middot; ${hidden.length} ${hidden.length > 1 ? 'Werke' : 'Werk'} ausgeblendet` : ''} <button type="button" id="filterReset">Alle anzeigen</button>`;
  }
  document.querySelectorAll('.chip[data-status]').forEach(chip => chip.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-status]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    document.body.setAttribute('data-filter', chip.dataset.status);
    applyFilter();
  }));
  document.querySelectorAll('.chip[data-site-toggle]').forEach(chip => chip.addEventListener('click', () => {
    chip.classList.toggle('inactive');

  }));
  document.getElementById('filterCount').addEventListener('click', e => {
    if(!e.target.closest('#filterReset')) return;
    document.querySelector('.chip[data-status="all"]').click();
    document.querySelectorAll('.chip.site.inactive').forEach(c => c.click());
  });

  // ---- pop-ups: a heat-map-only tool, a site's decisions, a system ----
  function openHmOnly(key){
    const [site, i] = key.split(':'), x = HM_ONLY.find(y => y.site === site && y.i === Number(i));
    if(!x) return;
    const st = SITE.hmSite(site), label = SITE.site(site).label;
    const re = new RegExp(x.match || x.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
    const rows = (st.areas || []).flatMap(a => (a.groups || []).flatMap(g => (g.rows || []).filter(r => re.test(r[1] || '')).map(r => ({a, r}))));
    SITE.openInfo({
      name: esc(x.name), desc: x.job,
      meta: `<span class="m-tag m-hm">Nur in der Heatmap genannt</span><span class="m-tag">${esc(label)}</span><span class="m-tag">${SITE.areaLabel(x.area)}</span>`,
      body: `<p class="sw-context">${esc(SITE.siteShort(site))} nennt ${esc(x.name)} in seiner Heatmap, es gehört aber nicht zu den Systemen der Werkslandschaft und wird daher nicht zu den ${SYS.length} gezählt.${x.note ? ' ' + x.note : ''}</p>
        <div class="ev-block"><h4 style="color:var(--fg3)">${esc(label).toUpperCase()} VALUE HEAT MAP &middot; WHERE THE SITE NAMED IT</h4>
          ${rows.length ? `<p class="ev-note"><a class="ev-link" href="${SITE.hmHref(site, rows[0].a.id)}">Heatmap von ${esc(SITE.siteShort(site))} öffnen &rarr;</a></p>` : ''}
          ${rows.map(({a, r}) => `<div class="hm-row"><span class="hm-sw ${r[2] || 'none'}"></span><span class="task">${r[0]}</span><span class="tool">${a.title} &middot; ${esc(r[1])}</span></div>`).join('')}

  }

      body: (n.lede ? `<p class="rv-lede">${n.lede}</p>` : '') +
        `<div class="rv-grid">${Object.keys(n.kinds || {}).map(k => {

          return ks.length ? `<div class="rv-grp"><span class="rv-k ${k}">${esc(n.kinds[k])}</span>
            <div class="sys">${ks.map(x => `<button type="button" data-sys-open="${esc(x)}" data-site="${site}">${SITE.flag(esc(x), n.items[x].flag)}</button>`).join('')}</div></div>` : '';
        }).join('')}</div>`
    });
  }
  container.addEventListener('click', e => {
    const ho = e.target.closest('[data-hm-only]');
    if(ho){ openHmOnly(ho.dataset.hmOnly); return; }
    const si = e.target.closest('[data-site-info]');
    if(si){ openSiteNote(si.dataset.siteInfo); return; }
    const card = e.target.closest('.card');
    if(card) SITE.openSystem(SITE.findSystem(card.dataset.name, card.dataset.site, card.dataset.area));
  });

  // ---- target state: every current system around the proposed solution, per site ----
  const T = L.target;
  document.getElementById('targetTitle').innerHTML = T.title || 'Zielbild-Referenzarchitektur je Werk';
  document.getElementById('targetSub').innerHTML = T.sub || `Eine ${esc(D.meta.product)}-Instanz je Werk, mit allen heutigen Systemen nach Geschäftsprozess darum herum.`;
  document.getElementById('targetTabs').innerHTML = D.sites.map((s, i) =>
    `<div class="target-tab${i === 0 ? ' active' : ''}" data-target-site="${s.key}">${esc(s.short || s.label)}</div>`).join('');
  document.getElementById('targetLegend').innerHTML = `
    <div class="item"><span class="swatch" style="background:var(--core)"></span>${esc(SITE.statusLabel('core'))}</div>
    <div class="item"><span class="swatch dashed"></span>${esc(SITE.statusLabel('extended'))}</div>
    <div class="item"><span class="swatch" style="background:var(--stays)"></span>${esc(SITE.statusLabel('stays'))}</div>
    <div class="item"><span class="badge-oos" style="position:relative;top:1px;"></span>heute bereits außer Support</div>`;

  const polar = (cx, cy, r, a) => [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  function arcPath(cx, cy, r, a0, a1){
    const [x0,y0] = polar(cx,cy,r,a0), [x1,y1] = polar(cx,cy,r,a1);

  }
  function renderTarget(siteKey){
    const site = SITE.site(siteKey);
    // Systems grouped by business process, in the same order as the areas above.
    const groups = D.areas.map(a => ({area:a, items: SYS.filter(d => d.site === siteKey && d.area === a.key)})).filter(g => g.items.length);
    const n = groups.reduce((t,g) => t + g.items.length, 0), g = groups.length;
    const W = 1200, H = 1000, cx = W/2, cy = H/2, R = 380, ARC_R = 330, LBL_R = 296, GAP = 0.115, PAD = 0.8;

    const spans = groups.map(gr => budget * (gr.items.length + PAD) / denom);
    let cursor = -Math.PI/2 - (spans[0] || 0)/2;
    let lines = '', brackets = '', nodes = '';
    groups.forEach((gr, k) => {
      const span = spans[k], gStart = cursor, gEnd = cursor + span;
      cursor = gEnd + GAP;
      const mid = gStart + span/2, [lx, ly] = polar(cx, cy, LBL_R, mid);
      const code = gr.area.code || gr.area.title.slice(0, 10).toUpperCase();
      const showTitle = span * LBL_R > 95 && gr.area.code;
      const boxW = Math.max(code.length*6.6, showTitle ? gr.area.title.length*5.0 : 0) + 16, boxH = showTitle ? 30 : 19;
      const tick = a => { const [x0,y0] = polar(cx, cy, ARC_R-7, a), [x1,y1] = polar(cx, cy, ARC_R+7, a);
        return `<line class="grp-tick" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" />`; };
      brackets += `
        <path class="grp-arc" d="${arcPath(cx, cy, ARC_R, gStart, gEnd)}" />${tick(gStart)}${tick(gEnd)}
        <rect class="grp-chip" x="${(lx-boxW/2).toFixed(1)}" y="${(ly-boxH/2).toFixed(1)}" width="${boxW.toFixed(1)}" height="${boxH}" rx="3" />
        <text x="${lx.toFixed(1)}" y="${(ly + (showTitle ? -2 : 4)).toFixed(1)}" text-anchor="middle" class="grp-code">${esc(code)}</text>
        ${showTitle ? `<text x="${lx.toFixed(1)}" y="${(ly+10).toFixed(1)}" text-anchor="middle" class="grp-title">${esc(gr.area.title)}</text>` : ''}
        <title>${esc(SITE.areaLabel(gr.area.key))} &mdash; ${gr.items.length} ${gr.items.length>1?'Systeme':'System'} heute</title>`;
      gr.items.forEach((d, i) => {
        const angle = gStart + span * (i + 0.5) / gr.items.length, [x, y] = polar(cx, cy, R, angle);
        const color = STATUS_COLOR[d.status];
        const dash = d.status === 'extended' ? 'stroke-dasharray="7,6"' : '';
        const sw = d.status === 'core' ? 2.75 : d.status === 'extended' ? 1.75 : 1.25;
        lines += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${color}" stroke-width="${sw}" ${dash} opacity="0.75" />`;
        const right = Math.cos(angle) >= 0, anchor = right ? 'start' : 'end', dx = right ? 14 : -14;
        nodes += `
          <g class="node" data-name="${esc(d.name)}" data-site="${d.site}" data-area="${d.area}">
            <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" style="fill:${color};stroke:var(--bg)" stroke-width="1.5" />
            ${d.oos ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="none" style="stroke:var(--oos)" stroke-width="1.5" />` : ''}
            <text x="${(x + dx).toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="${anchor}" class="node-label">${esc(d.name)}${d.ext ? '  ⇄' : ''}</text>
            <text x="${(x + dx).toFixed(1)}" y="${(y + 11).toFixed(1)}" text-anchor="${anchor}" class="node-desc">${esc(d.desc)}</text>
            <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="transparent" />
            <title>${esc(d.name)} &mdash; ${esc(SITE.statusLabel(d.status))} &middot; ${esc(SITE.areaLabel(d.area))}${d.oos ? ' &middot; bereits außer Support' : ''}${d.ext ? ' &middot; heute externe Schnittstelle' : ''}</title>
          </g>`;
      });
    });
    const center = (T.center && T.center.length ? T.center : [D.meta.product]).slice(0, 2);
    const c1 = center.length === 2 ? -6 : 4;
    const svg = `
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        ${lines}${brackets}${nodes}
        <rect x="${cx-115}" y="${cy-38}" width="230" height="76" rx="6" style="fill:var(--core);stroke:var(--bg)" stroke-width="2" />
        <text x="${cx}" y="${cy + c1}" text-anchor="middle" class="center-label">${esc(center[0])}</text>
        ${center[1] ? `<text x="${cx}" y="${cy+13}" text-anchor="middle" class="center-label">${esc(center[1])}</text>` : ''}
        <text x="${cx}" y="${cy+29}" text-anchor="middle" class="center-sub">${esc(site.short || site.label)} &middot; target</text>
      </svg>`;
    // Phones get the same systems as a list: the ring's labels are unreadable at that size.
    const list = `<div class="target-list" aria-label="${esc(site.label)} Systeme nach Geschäftsprozess">
      ${groups.map(gr => `<div class="tl-group">
        <div class="tl-head">${gr.area.code ? `<span class="tl-code">${esc(gr.area.code)}</span>` : ''}${esc(gr.area.title)}</div>
        ${gr.items.map(d => `<button type="button" class="tl-item" data-status="${d.status}" data-name="${esc(d.name)}" data-site="${d.site}" data-area="${d.area}">
          <span class="tl-dot"></span><span class="tl-n">${SITE.flag(esc(d.name), d.flag)}${d.oos ? ' <span class="badge-oos" title="Bereits außer Support"></span>' : ''}</span>
          <span class="tl-d">${esc(d.desc)}</span><span class="tl-s">${esc(SITE.statusLabel(d.status))}</span></button>`).join('')}
      </div>`).join('')}
    </div>`;
    document.getElementById('diagramHolder').innerHTML = svg + list;
  }
  document.querySelectorAll('.target-tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.target-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderTarget(tab.dataset.targetSite);
  }));
  document.getElementById('diagramHolder').addEventListener('click', e => {
    const g = e.target.closest('g.node, .tl-item');
    if(g) SITE.openSystem(SITE.findSystem(g.dataset.name, g.dataset.site, g.dataset.area));
  });

  applyFilter();
  if(D.sites.length) renderTarget(D.sites[0].key);
});

}};

  var cur = null, recorded = [], rec = null, sub = '';
  var add = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function(t, f, o){
    if(rec && (this === document || this === window)) rec.push([this, t, f, o]);
    return add.call(this, t, f, o);
  };
  var parse = function(){
    var m = /^#\/([A-Za-z0-9_]+)(?:~(.*))?$/.exec(location.hash);
    return {key: m && PAGE[m[1]] ? m[1] : 'home', sub: m && m[2] ? m[2] : ''};
  };
  window.SPA = {
    here: 'index.html',
    get hash(){ return sub ? '#' + sub : ''; },
    set: function(h){ var s = String(h).replace(/^#/, ''); sub = s; try { history.replaceState(null, '', '#/' + cur + (s ? '~' + s : '')); } catch(e) {} },
    go: function(href){
      var m = /^([^#]*)(#(.*))?$/.exec(href || ''); var key = FILES[m[1]]; if(!key) return;
      var next = '#/' + key + (m[3] ? '~' + m[3] : '');
      if(location.hash !== next) location.hash = next;
    }
  };
  var render = function(){
    var st = parse();
    recorded.forEach(function(r){ r[0].removeEventListener(r[1], r[2], r[3]); }); recorded = [];
    cur = st.key; sub = st.sub; SPA.here = KEYFILE[cur];
    var p = PAGE[cur];
    document.getElementById('pagestyle').textContent = p.style;
    var bd = document.body; bd.className = ''; ['data-filter','data-modal'].forEach(function(n){ bd.removeAttribute(n); });
    Object.keys(p.attrs).forEach(function(n){ bd.setAttribute(n, p.attrs[n] || ''); });
    document.getElementById('spa').innerHTML = p.markup;
    rec = [];
    try { SITE.renderNav(); SITE.initTheme(); p.fn(); }
    finally { recorded = rec; rec = null; }
    window.scrollTo(0, 0);
  };
  window.addEventListener('hashchange', function(){
    var st = parse();
    if(st.key !== cur) render(); else sub = st.sub;
  });
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(!a) return;
    var h = a.getAttribute('href') || '';
    var m = /^([^#]*)(#.*)?$/.exec(h);
    if(m && FILES[m[1]]){ e.preventDefault(); SPA.go(h); }
  }, true);
  render();
})();

</script>
