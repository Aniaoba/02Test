<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tucker GmbH — Engagement site</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
/* site.css — the shared design system for every page of the engagement site.
   One copy of: palette and both themes, page nav, cards, system-card modal, flags, folds,
   process flow, heat maps, fit, timeline. Pages add only their own layout on top. */

  :root{
    --bg: #0B1220;
    --panel: #111B2E;
    --panel-2: #0E1728;
    --grid-line: rgba(148,163,184,0.08);
    --text: #E8EDF5;
    --text-dim: #8CA0BE;
    --text-faint: #8495AF;
    --hairline: rgba(148,163,184,0.16);

    --core: #F2994A;
    --core-bg: rgba(242,153,74,0.10);
    --extended: #38BDF8;
    --extended-bg: rgba(56,189,248,0.10);
    --stays: #64748B;
    --stays-bg: rgba(100,116,139,0.10);
    --oos: #EF4444;

    --fg3: #4ADE80;   /* 3 = out of the box  */
    --fg2: #F59E0B;   /* 2 = customisation   */
    --fg1: #A78BFA;   /* 1 = bolt-on         */
    --teal:#2DD4BF;

    --hm-r:#F87171; --hm-o:#F59E0B; --hm-g:#4ADE80; --bar:#38BDF8; --hm-r-t:#F87171; --hm-o-t:#F59E0B; --hm-g-t:#4ADE80; --on-fill:#0B1220; --q4:#22C55E; --q3-bg:rgba(74,222,128,0.10);
    --on-accent:#0B1220; --bracket:rgba(148,163,184,0.42); --node-hover:#FFFFFF;
    color-scheme:dark;
  }
  /* light theme: follows the OS unless the toggle forces one */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
    --bg:#F4F6F9; --panel:#FFFFFF; --panel-2:#EEF2F6;
      --grid-line:rgba(15,23,42,0.045); --text:#0F172A; --text-dim:#475569; --text-faint:#56667D;
      --hairline:rgba(15,23,42,0.14);
      --core:#C2410C; --core-bg:rgba(234,88,12,0.08); --extended:#0369A1; --extended-bg:rgba(2,132,199,0.08);
      --stays:#64748B; --stays-bg:rgba(100,116,139,0.08); --oos:#DC2626;
      --fg3:#15803D; --fg2:#B45309; --fg1:#6D28D9; --teal:#0F766E;
      --hm-r:#DC2626; --hm-o:#D97706; --hm-g:#16A34A; --bar:#0284C7; --hm-r-t:#B91C1C; --hm-o-t:#92400E; --hm-g-t:#166534; --on-fill:#0F172A; --q4:#166534; --q3-bg:rgba(22,163,74,0.08);
      --on-accent:#FFFFFF; --bracket:rgba(71,85,105,0.45); --node-hover:#0F172A;
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F6F9; --panel:#FFFFFF; --panel-2:#EEF2F6;
    --grid-line:rgba(15,23,42,0.045); --text:#0F172A; --text-dim:#475569; --text-faint:#56667D;
    --hairline:rgba(15,23,42,0.14);
    --core:#C2410C; --core-bg:rgba(234,88,12,0.08); --extended:#0369A1; --extended-bg:rgba(2,132,199,0.08);
    --stays:#64748B; --stays-bg:rgba(100,116,139,0.08); --oos:#DC2626;
    --fg3:#15803D; --fg2:#B45309; --fg1:#6D28D9; --teal:#0F766E;
    --hm-r:#DC2626; --hm-o:#D97706; --hm-g:#16A34A; --bar:#0284C7; --hm-r-t:#B91C1C; --hm-o-t:#92400E; --hm-g-t:#166534; --on-fill:#0F172A; --q4:#166534; --q3-bg:rgba(22,163,74,0.08);
    --on-accent:#FFFFFF; --bracket:rgba(71,85,105,0.45); --node-hover:#0F172A;
    color-scheme:light;
  }
  /* ---- shared page nav (Home + theme), same markup on every page ---- */
  .pagenav{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 0 12px;
    position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--hairline); margin-bottom:16px;}
  html{scroll-padding-top:76px;}
  .home-link, .theme-toggle{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px;
    letter-spacing:0.04em; cursor:pointer; background:var(--panel); color:var(--text-dim);
    border:1px solid var(--hairline); border-radius:4px; padding:0 13px; min-height:40px;
    display:inline-flex; align-items:center; gap:7px; text-decoration:none;}
  .home-link:hover, .theme-toggle:hover{color:var(--text); border-color:var(--text-dim);}
  .home-link:active, .theme-toggle:active{transform:translateY(1px);}

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }
  body{
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
    overflow-wrap:break-word;
  }
  .wrap{max-width:1280px; margin:0 auto; padding:28px 24px 60px;}

  header{border-bottom:1px solid var(--hairline); padding-bottom:20px; margin-bottom:18px;}
  .eyebrow{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; letter-spacing:0.14em; color:var(--text-faint); margin:0 0 8px;}
  h1{font-size:26px; font-weight:700; margin:0 0 6px; letter-spacing:-0.01em;}
  .sub{color:var(--text-dim); font-size:14.5px; max-width:760px; line-height:1.55; margin:0;}

  .controls{display:flex; flex-wrap:wrap; gap:22px; align-items:flex-start; padding:16px 0; border-bottom:1px solid var(--hairline); margin-bottom:6px;}
  .ctrl-group{display:flex; flex-direction:column; gap:8px;}
  .ctrl-label{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:10.5px; letter-spacing:0.1em; color:var(--text-faint);}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    font-size:12.5px; padding:6px 11px; border-radius:3px; cursor:pointer; user-select:none;
    border:1px solid var(--hairline); background:transparent; color:var(--text-dim);
    display:flex; align-items:center; gap:6px; transition:border-color .12s, color .12s, background .12s;
  }
  .chip:hover{border-color:var(--text-dim); color:var(--text);}
  .chip .dot{width:8px; height:8px; border-radius:2px; flex:none;}
  .chip.active{color:var(--text); background:var(--panel); border-color:currentColor;}
  .chip[data-status="core"].active{color:var(--core); border-color:var(--core);}
  .chip[data-status="extended"].active{color:var(--extended); border-color:var(--extended);}
  .chip[data-status="stays"].active{color:var(--stays); border-color:var(--stays);}
  .chip[data-status="all"].active{color:var(--text); border-color:var(--text);}
  .chip.site.inactive{opacity:0.35;}

  .stats{display:flex; gap:26px; padding:14px 0 20px; flex-wrap:wrap;}
  .stat{display:flex; flex-direction:column; flex:0 0 auto;}
  .stat .n{font-size:22px; font-weight:700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
  .stat .l{font-size:11px; color:var(--text-faint); letter-spacing:0.04em;}
  .stat.core .n{color:var(--core);}
  .stat.extended .n{color:var(--extended);}
  .stat.stays .n{color:var(--stays);}

  .legend-note{color:var(--text-faint); font-size:12px; line-height:1.6; max-width:900px; margin:2px 0 0;}

  .area{margin-top:34px;}
  .area-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; margin-bottom:12px;}
  .area-code{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11.5px; color:var(--text-faint); border:1px solid var(--hairline); padding:2px 7px; border-radius:3px;}
  .area-title{font-size:16px; font-weight:600;}
  .area-desc{color:var(--text-faint); font-size:12px; margin-left:4px;}
  .area-desc b{font-weight:600;} .area-desc .c{color:var(--core);} .area-desc .e{color:var(--extended);} .area-desc .o{color:var(--oos);}

  .site-grid{display:grid; grid-template-columns:repeat(var(--sites,4),minmax(0,1fr)); gap:14px;}
  .site-col{min-width:0;}
  .site-col-head{font-size:11.5px; color:var(--text-dim); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:0.04em; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--hairline);}
  .cards{display:flex; flex-direction:column; gap:6px;}
  .empty-cell{color:var(--text-faint); font-size:12px; padding:6px 0; opacity:0.5;}

  .card{
    background:var(--panel); border:1px solid var(--hairline); border-left:3px solid var(--stays);
    border-radius:2px; padding:8px 10px; transition:opacity .15s;
  }
  .card[data-status="core"]{border-left-color:var(--core); background:linear-gradient(90deg, var(--core-bg), var(--panel) 40%);}
  .card[data-status="extended"]{border-left-color:var(--extended); background:linear-gradient(90deg, var(--extended-bg), var(--panel) 40%);}
  .card[data-status="stays"]{border-left-color:var(--stays); background:linear-gradient(90deg, var(--stays-bg), var(--panel) 40%);}
  .card .name{font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;}
  .card .desc{font-size:11.5px; color:var(--text-dim); margin-top:2px; line-height:1.35;}
  .badge-oos{width:6px; height:6px; border-radius:50%; background:var(--oos); flex:none;}
  .badge-ext{font-size:10px; color:var(--text-faint); border:1px solid var(--hairline); border-radius:2px; padding:0 4px; flex:none;}


  body[data-filter="core"] .card:not([data-status="core"]),
  body[data-filter="extended"] .card:not([data-status="extended"]),
  body[data-filter="stays"] .card:not([data-status="stays"]){
    display:none;
  }
  .area.no-match, .site-col .empty-filter{display:none;}
  .site-col.filtered-empty .empty-filter{display:block;}
  .filter-count{font-size:12.5px; color:var(--text-dim); margin:-8px 0 14px; display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .filter-count b{color:var(--text);}
  .filter-count button{font:inherit; font-size:11.5px; color:var(--extended); background:none; border:1px solid var(--hairline); border-radius:3px; padding:3px 8px; cursor:pointer;}

  footer{margin-top:44px; padding-top:18px; border-top:1px solid var(--hairline); color:var(--text-faint); font-size:11.5px; line-height:1.7;}

  @media (max-width:980px){
    .site-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:600px){
    .site-grid{grid-template-columns:1fr;}
  }

  .target-section{margin-top:52px; padding-top:28px; border-top:1px solid var(--hairline);}
  .target-head h2{font-size:20px; font-weight:700; margin:0 0 6px;}
  .target-head .sub{margin-bottom:16px;}
  .target-tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
  .target-tab{
    font-size:12.5px; padding:7px 14px; border-radius:3px; cursor:pointer; user-select:none;
    border:1px solid var(--hairline); background:transparent; color:var(--text-dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .target-tab:hover{color:var(--text);}
  .target-tab.active{color:var(--text); background:var(--panel); border-color:var(--text-dim);}
  .target-legend{display:flex; flex-wrap:wrap; gap:18px; margin-bottom:18px; font-size:12px; color:var(--text-dim);}
  .target-legend .item{display:flex; align-items:center; gap:7px;}
  .target-legend .swatch{width:20px; height:3px; border-radius:2px; flex:none;}
  .target-legend .swatch.dashed{background:none; border-top:3px dashed var(--extended); height:0;}
  .diagram-holder{background:var(--panel-2); border:1px solid var(--hairline); border-radius:4px; padding:6px;}
  .diagram-holder svg{width:100%; height:auto; display:block;}
  .node-label{font-size:12.5px; font-weight:600; fill:var(--text); font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;}
  .node-desc{font-size:10px; fill:var(--text-faint); font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;}
  .center-label{font-size:15px; font-weight:700; fill:var(--on-accent); font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;}
  .center-sub{font-size:10.5px; fill:var(--on-accent); opacity:0.75; font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;}

  /* clickable cards */
  .card{cursor:pointer;}
  .card:hover{border-color:var(--text-dim);}

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,10,20,0.72);
    display:none; align-items:center; justify-content:center; z-index:1000;
    padding:24px; backdrop-filter:blur(2px);
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--hairline);
    border-top:3px solid var(--stays); border-radius:6px;
    max-width:640px; width:100%; max-height:86vh; overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,0.55);
  }
  .modal[data-status="core"]{border-top-color:var(--core);}
  .modal[data-status="extended"]{border-top-color:var(--extended);}
  .modal[data-status="stays"]{border-top-color:var(--stays);}
  .modal-head{padding:18px 22px 14px; border-bottom:1px solid var(--hairline); position:relative;}
  .modal-head .m-name{font-size:19px; font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .modal-head .m-desc{font-size:12.5px; color:var(--text-dim); margin-top:4px;}
  .modal-head .m-meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .modal-head .m-tag{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:10.5px; letter-spacing:0.05em; color:var(--text-dim);
    border:1px solid var(--hairline); border-radius:3px; padding:3px 8px;
  }
  .modal-head .m-tag.status-core{color:var(--core); border-color:var(--core);}
  .modal-head .m-tag.status-extended{color:var(--extended); border-color:var(--extended);}
  .modal-head .m-tag.status-stays{color:var(--stays); border-color:var(--stays);}
  .modal-close{
    position:absolute; top:14px; right:16px; cursor:pointer; border:none; background:transparent;
    color:var(--text-faint); font-size:22px; line-height:1; padding:2px 6px; border-radius:3px;
  }
  .modal-close:hover{color:var(--text); background:var(--panel-2);}
  .modal-body{padding:18px 22px 22px;}
  .sw-context{font-size:12px; color:var(--text-faint); line-height:1.55; margin:0 0 16px;}
  .sw-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .sw-col h4{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:11px; letter-spacing:0.08em; margin:0 0 8px; display:flex; align-items:center; gap:6px;
  }
  .sw-col.str h4{color:var(--fg3);}
  .sw-col.wk h4{color:var(--hm-r-t);}
  .sw-col ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px;}
  .sw-col li{font-size:12.5px; line-height:1.45; color:var(--text); padding-left:16px; position:relative;}
  .sw-col.str li::before{content:"+"; position:absolute; left:0; color:var(--fg3); font-weight:700;}
  .sw-col.wk li::before{content:"\2212"; position:absolute; left:0; color:var(--hm-r-t); font-weight:700;}
  .sw-fallback{font-size:12.5px; color:var(--text-dim); line-height:1.55;}

  /* documented evidence */
  .ev-sep{height:1px; background:var(--hairline); margin:20px 0 18px;}
  .ev-block{margin-bottom:18px;}
  .ev-block h4{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:11px; letter-spacing:0.08em; margin:0 0 4px; color:var(--extended);
  }
  .ev-note{font-size:11.5px; color:var(--text-faint); margin:0 0 10px; line-height:1.45;}
  .ev-note.ev-none{font-size:12px; color:var(--text-dim); font-style:italic; margin-bottom:0;}
  blockquote.ev{
    margin:0 0 9px; padding:9px 12px; background:var(--panel-2);
    border-left:2px solid var(--extended); border-radius:0 3px 3px 0;
  }
  blockquote.ev p{margin:0; font-size:12.5px; line-height:1.5; color:var(--text);}
  blockquote.ev cite{
    display:block; margin-top:6px; font-style:normal;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:10.5px; letter-spacing:0.03em; color:var(--text-faint);
  }
  .ev-foot{font-size:11px; color:var(--text-faint); line-height:1.5; margin:14px 0 0;}
  .ev-foot code{font-size:10.5px; background:var(--panel-2); padding:1px 4px; border-radius:2px;}

  /* process grouping in the target-state ring */
  .grp-arc{fill:none; stroke:var(--bracket); stroke-width:2; stroke-linecap:round;}
  .grp-tick{stroke:var(--bracket); stroke-width:2; stroke-linecap:round;}
  .grp-chip{fill:var(--panel-2); stroke:var(--hairline); stroke-width:1;}
  .grp-code{font-size:11px; font-weight:700; letter-spacing:0.07em; fill:var(--text-dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
  .grp-title{font-size:9.5px; fill:var(--text-faint);
    font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;}

  /* clickable diagram nodes */
  #diagramHolder g.node{cursor:pointer;}
  #diagramHolder g.node:hover circle{stroke:var(--text); stroke-width:2;}
  #diagramHolder g.node:hover text.node-label{fill:var(--node-hover);}


  /* ---------- fit-gap section ---------- */
  .fitgap-section{margin-top:52px; padding-top:28px; border-top:1px solid var(--hairline);}
  .fitgap-section h2{font-size:20px; font-weight:700; margin:0 0 6px;}
  .fg-scale{display:flex; flex-wrap:wrap; gap:16px; margin:14px 0 22px; font-size:12px; color:var(--text-dim);}
  .fg-scale .item{display:flex; align-items:center; gap:7px;}
  .fg-scale .sw{width:10px; height:10px; border-radius:2px; flex:none;}

  .fg-cov{border:1px solid var(--hairline); border-radius:4px; overflow:hidden; margin-bottom:30px;}
  .fg-cov-row{display:grid; grid-template-columns:190px 1fr 108px; gap:14px; align-items:center;
    padding:9px 14px; border-bottom:1px solid var(--hairline);}
  .fg-cov-row:last-child{border-bottom:none;}
  .fg-cov-row:hover{background:var(--panel-2);}
  .fg-cov-row.is-clean{opacity:0.62;}
  .fg-cov-name{font-size:12.5px; display:flex; align-items:baseline; gap:7px; min-width:0;}
  .fg-cov-name .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:var(--text-faint);}
  .fg-cov-name .t{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fg-bar{display:flex; height:9px; border-radius:2px; overflow:hidden; background:var(--panel-2); min-width:0;}
  .fg-bar span{display:block; height:100%;}
  .fg-cov-n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px;
    color:var(--text-faint); text-align:right; white-space:nowrap;}
  .fg-cov-n b{color:var(--text); font-weight:600;}

  .fg-group{margin-bottom:26px;}
  .fg-group-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px;}
  .fg-group-head .area-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px; color:var(--text-faint); border:1px solid var(--hairline); padding:2px 7px; border-radius:3px;}
  .fg-group-head .t{font-size:15px; font-weight:600;}
  .fg-group-head .n{font-size:11.5px; color:var(--text-faint);}
  .fg-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr)); gap:10px;}
  .fg-card{
    background:var(--panel); border:1px solid var(--hairline); border-left:3px solid var(--fg2);
    border-radius:2px; padding:10px 12px; cursor:pointer; transition:border-color .12s;
  }
  .fg-card:hover{border-color:var(--text-dim);}
  .fg-card[data-score="1"]{border-left-color:var(--fg1);}
  .fg-card .top{display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap;}
  .fg-ref{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:var(--text-dim);}
  .fg-pill{font-size:10px; letter-spacing:0.04em; border-radius:2px; padding:1px 6px; flex:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .fg-pill.s2{color:var(--fg2); border:1px solid var(--fg2);}
  .fg-pill.s1{color:var(--fg1); border:1px solid var(--fg1);}
  .fg-pill.must{color:var(--oos); border:1px solid rgba(239,68,68,0.5);}
  .fg-pill.should,.fg-pill.could{color:var(--text-faint); border:1px solid var(--hairline);}
  .fg-card .sub{font-size:10.5px; color:var(--text-faint); margin-bottom:4px;}
  .fg-card .req{font-size:12.5px; line-height:1.45; color:var(--text);}
  .fg-card .more{font-size:10.5px; color:var(--text-faint); margin-top:7px;}

  /* requirement modal */
  .modal[data-score="2"]{border-top-color:var(--fg2);}
  .modal[data-score="1"]{border-top-color:var(--fg1);}
  .rq-req{font-size:13.5px; line-height:1.55; color:var(--text); margin:0 0 16px;
    padding:11px 13px; background:var(--panel-2); border-radius:3px; border-left:2px solid var(--hairline);}
  .rq-h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px;
    letter-spacing:0.08em; margin:0 0 7px;}
  .rq-h.vendor{color:var(--fg2);}
  .rq-h.why{color:var(--extended);}
  .rq-com{font-size:12.5px; line-height:1.55; color:var(--text); margin:0 0 6px;}
  .rq-sol{font-size:11px; color:var(--text-faint); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; margin:0 0 18px;}
  @media (max-width:700px){ .fg-cov-row{grid-template-columns:1fr; gap:6px;} .fg-cov-n{text-align:left;} }
  @media (max-width:560px){ .sw-grid{grid-template-columns:1fr;} }

  /* ---------- value section ---------- */
  .val-h3{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; letter-spacing:0.1em;
    color:var(--text-dim); margin:34px 0 4px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .val-h3 .src{color:var(--text-faint); letter-spacing:0.02em; font-size:10.5px;}
  .val-lede{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin:0 0 14px; max-width:900px;}
  .val-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr)); gap:10px; margin-bottom:16px;}
  .val-tile{background:var(--panel); border:1px solid var(--hairline); border-radius:3px; padding:12px 14px;}
  .val-tile .n{font-size:21px; font-weight:700; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--text);}
  .val-tile .l{font-size:11px; color:var(--text-faint); letter-spacing:0.04em; margin-top:2px;}
  .val-tile .d{font-size:11.5px; color:var(--text-dim); margin-top:6px; line-height:1.45;}
  .val-tile.warn .n{color:var(--core);}
  .val-grid2{display:grid; grid-template-columns:1.25fr 0.75fr; gap:18px; align-items:start;}
  @media (max-width:900px){ .val-grid2{grid-template-columns:1fr;} }
  .val-grid2 > *, .hm-grid > *{min-width:0;}
  .hm-tab{max-width:100%;}
  .val-table-wrap{overflow-x:auto; border:1px solid var(--hairline); border-radius:4px; background:var(--panel);}
  table.val-table{width:100%; border-collapse:collapse; font-size:12px;}
  .val-table th{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:0.06em;
    color:var(--text-faint); font-weight:600; text-align:right; padding:8px 10px; border-bottom:1px solid var(--hairline); white-space:nowrap;}
  .val-table th:first-child,.val-table td:first-child{text-align:left;}
  .val-table td{padding:7px 10px; border-bottom:1px solid var(--hairline); text-align:right; white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--text);}
  .val-table td:first-child{font-family:inherit; font-weight:600;}
  .val-table tr:last-child td{border-bottom:none;}
  .val-table tr.tot td{color:var(--text-dim); font-weight:700;}
  .val-table tr.subrow td{color:var(--text-dim); font-size:11.5px;}
  .val-table tr.subrow td:first-child{font-weight:400;}
  .val-table td.neg{color:var(--hm-r-t);}
  .val-table td.dim{color:var(--text-faint);}
  .val-table td.wrap{white-space:normal; font-family:inherit; color:var(--text-dim); text-align:left; min-width:220px;}
  .val-table tr:hover td{background:var(--panel-2);}
  .val-foot{font-size:11px; color:var(--text-faint); line-height:1.55; margin:8px 0 0;}
  .rank{display:inline-block; font-size:10px; padding:1px 6px; border-radius:2px; border:1px solid var(--hairline); color:var(--text-dim);}
  .rank.worst{color:var(--hm-r-t); border-color:rgba(248,113,113,0.5);}
  .rank.best{color:var(--hm-g-t); border-color:rgba(74,222,128,0.5);}

  .hbar{display:grid; grid-template-columns:150px 1fr 44px; gap:10px; align-items:center; padding:4px 0; font-size:12px;}
  .hbar .t{color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hbar .track{height:9px; background:var(--panel-2); border-radius:2px; overflow:hidden;}
  .hbar .fill{height:100%; background:var(--bar); border-radius:0 4px 4px 0;}
  .hbar .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:var(--text); text-align:right;}
  .val-panel{background:var(--panel); border:1px solid var(--hairline); border-radius:4px; padding:14px 16px;}
  .val-panel h5{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:0.08em;
    color:var(--text-faint); font-weight:600; margin:0 0 8px;}

  /* heat map explorer */
  .hm-key{display:flex; flex-wrap:wrap; gap:16px; margin:10px 0 16px; font-size:12px; color:var(--text-dim);}
  .hm-key .item{display:flex; align-items:center; gap:7px;}
  .hm-sw{width:10px; height:10px; border-radius:2px; flex:none; display:inline-block;}
  .hm-sw.R{background:var(--hm-r);} .hm-sw.O{background:var(--hm-o);} .hm-sw.G{background:var(--hm-g);}
  .hm-sw.none{background:transparent; border:1px dashed var(--text-faint);}
  .hm-tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .hm-tab{font-size:12px; padding:6px 11px; border-radius:3px; cursor:pointer; border:1px solid var(--hairline);
    background:transparent; color:var(--text-dim); font-family:inherit; display:inline-flex; gap:7px; align-items:center;}
  .hm-tab:hover{color:var(--text); border-color:var(--text-dim);}
  .hm-tab.active{color:var(--text); background:var(--panel); border-color:var(--text-dim);}
  .hm-tab .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; color:var(--text-faint);}
  .hm-tab .dots{display:inline-flex; gap:2px;}
  .hm-tab .dots i{width:6px; height:6px; border-radius:1px; display:inline-block;}
  .hm-detail{background:var(--panel); border:1px solid var(--hairline); border-radius:4px; padding:20px 22px;}
  .hm-detail-top{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; border-bottom:1px solid var(--hairline); padding-bottom:14px; margin-bottom:16px;}
  .hm-detail-top .k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; letter-spacing:0.08em; color:var(--extended);}
  .hm-detail-top .t{font-size:18px; font-weight:700; margin-top:4px;}
  .hm-counts{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-dim); align-items:center;}
  .hm-counts b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--text);}
  .hm-grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:26px;}
  @media (max-width:860px){ .hm-grid{grid-template-columns:1fr;} }
  .hm-block{margin-bottom:18px;}
  .hm-sum{display:grid; grid-template-columns:1.35fr 1fr 1.25fr; gap:24px; align-items:start;
    padding-bottom:4px; margin-bottom:16px; border-bottom:1px solid var(--hairline);}
  .hm-sum > *{min-width:0;}
  .hm-tasks{margin-bottom:0;}
  .hm-cols{column-count:2; column-gap:34px;}
  .hm-grp{break-inside:avoid-column; margin-bottom:12px;}
  .hm-grp:has(.hm-row:nth-child(12)){break-inside:auto;}
  .hm-grp .hm-proc-g{margin-top:0; break-after:avoid;}
  .hm-cols .hm-row{break-inside:avoid;}
  @media (max-width:1040px){ .hm-sum{grid-template-columns:1fr 1fr;} .hm-sum > :first-child{grid-column:1 / -1;} }
  @media (max-width:760px){ .hm-sum{grid-template-columns:1fr;} .hm-cols{column-count:1;} }
  .hm-block h5{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:0.08em;
    color:var(--text-faint); font-weight:600; margin:0 0 8px;}
  .hm-oc{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px;}
  .hm-oc span{font-size:11.5px; padding:3px 8px; border-radius:2px; background:var(--panel-2); border:1px solid var(--hairline); color:var(--text-dim);}
  .hm-oc.H span{color:var(--text); border-color:rgba(242,153,74,0.55);}
  .hm-oc-lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; letter-spacing:0.06em; color:var(--text-faint); margin:0 0 4px;}
  .hm-oc-lbl.H{color:var(--core);}
  .hm-facts{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr)); gap:6px;}
  .hm-fact{background:var(--panel-2); border-radius:3px; padding:7px 9px;}
  .hm-fact .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; font-weight:700; color:var(--text);}
  .hm-fact .l{font-size:10.5px; color:var(--text-faint); line-height:1.35; margin-top:2px;}
  .hm-proc-g{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:0.06em;
    color:var(--text-dim); margin:12px 0 4px; padding-bottom:4px; border-bottom:1px solid var(--hairline);}
  .hm-proc-g:first-child{margin-top:0;}
  .hm-row{display:grid; grid-template-columns:10px minmax(0,1fr) minmax(0,0.95fr); gap:9px; align-items:baseline; padding:4px 0; font-size:12px;}
  .hm-row .hm-sw{position:relative; top:1px;}
  .hm-row .task{color:var(--text); line-height:1.35;}
  .hm-row .tool{color:var(--text-faint); font-size:11.5px; line-height:1.35;}
  .hm-row .lvl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:9.5px; letter-spacing:0.04em; margin-left:6px;}
  .hm-row .lvl.R{color:var(--hm-r-t);} .hm-row .lvl.O{color:var(--hm-o-t);} .hm-row .lvl.G{color:var(--hm-g-t);}
  .hm-sys{color:var(--extended); cursor:pointer; border-bottom:1px dotted rgba(56,189,248,0.5);}
  .hm-sys:hover{color:var(--text);}
  .hm-quote{margin:14px 0 0;}

  /* maturity matrix: processes x sites, rated 1-4 */
  .qm{margin-top:4px;}
  .qm-lead{font-size:12.5px; line-height:1.55; color:var(--text-dim); margin:0 0 14px; max-width:980px;}
  .qm-lead b{color:var(--text);}
  .qm-sites{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr)); gap:10px; margin-bottom:14px;}
  .qm-site{background:var(--panel-2); border:1px solid var(--hairline); border-radius:3px; padding:11px 13px;}
  .qm-site .n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:0.06em; color:var(--text-faint);}
  .qm-site .avg{font-size:22px; font-weight:700; margin:3px 0 2px; font-variant-numeric:tabular-nums;}
  .qm-site .avg small{font-size:11px; font-weight:400; color:var(--text-faint);}
  .qm-dist{display:flex; height:6px; border-radius:2px; overflow:hidden; margin:6px 0 6px; background:var(--hairline);}
  .qm-dist span{display:block; height:100%;}
  .qm-site .d{font-size:11px; color:var(--text-dim); line-height:1.45;}
  .qm-r{display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 4px; border-radius:2px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; font-weight:700; color:var(--on-accent); flex:none;}
  .qm-r.r1,.qm-dist .r1{background:var(--hm-r);} .qm-r.r2,.qm-dist .r2{background:var(--hm-o);}
  .qm-r.r3,.qm-dist .r3{background:var(--hm-g);} .qm-r.r4,.qm-dist .r4{background:var(--q4);}
  .qm-r.r2,.qm-r.r3{color:var(--on-fill);}
  .qm-r.r0{background:transparent; border:1px dashed var(--text-faint); color:var(--text-faint);}
  .qm-legend{display:flex; flex-wrap:wrap; gap:12px; font-size:11px; color:var(--text-dim); margin:0 0 8px;}
  .qm-legend span{display:inline-flex; align-items:center; gap:5px;}
  table.qm-table{width:100%; border-collapse:collapse; font-size:12px; min-width:900px;}
  .qm-table th{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; letter-spacing:0.06em; font-weight:600;
    color:var(--text-faint); text-align:left; padding:8px 10px; border-bottom:1px solid var(--hairline); background:var(--panel-2); vertical-align:bottom;}
  .qm-table td{padding:8px 10px; border-bottom:1px solid var(--hairline); vertical-align:top;}
  .qm-table tr:last-child td{border-bottom:none;}
  .qm-table tr:hover td{background:var(--panel-2);}
  .qm-table .proc{font-weight:600; color:var(--text); min-width:170px;}
  .qm-table .proc ul{margin:4px 0 0; padding-left:14px; font-weight:400; font-size:11px; color:var(--text-faint); line-height:1.45;}
  .qm-cell{display:flex; gap:7px; align-items:flex-start; min-width:120px;}
  .qm-cell .qt{color:var(--text-dim); line-height:1.35; font-size:11.5px;}
  .qm-table td.worst{box-shadow:inset 3px 0 0 var(--hm-r);}
  .qm-table td.tgt{color:var(--text-dim); font-size:11.5px; line-height:1.4; min-width:170px;}
  .qm-table td.tgt .src{display:block; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:9.5px; letter-spacing:0.05em; color:var(--text-faint); margin-top:2px;}
  .qm-table td.tgt .qm-sub{font-size:11.5px; display:block; margin-top:6px; padding-top:6px; border-top:1px dashed var(--hairline);}
  .qm-table td.avgc{font-variant-numeric:tabular-nums; color:var(--text-dim); white-space:nowrap;}
  .qm-table tr.qm-row{cursor:pointer;}
  .qm-table tr.qm-row .qm-toggle::before{content:"\25B8"; display:inline-block; width:14px; text-indent:0; color:var(--text-faint); transition:transform .15s;}
  .qm-table tr.qm-row.open .qm-toggle::before{transform:rotate(90deg);}
  .qm-table tr.qm-det{display:none;}
  .qm-table tr.qm-det.open{display:table-row;}
  .qm-table tr.qm-det:hover td{background:transparent;}
  .qm-table tr.qm-det > td{background:var(--panel-2); padding:14px 16px 16px;}
  .qm-det .ab{display:grid; grid-template-columns:1fr 1fr; gap:14px; font-size:12px; line-height:1.5; color:var(--text-dim); margin-bottom:12px; max-width:1100px;}
  .qm-det .ab h6{margin:0 0 3px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:9.5px; letter-spacing:0.07em; color:var(--text-faint); font-weight:600;}
  .qm-tools{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; align-items:center; margin:0 0 8px;}
  .qm-btn{font:inherit; font-size:11px; color:var(--extended); background:transparent; border:1px solid var(--hairline); border-radius:3px; padding:4px 9px; cursor:pointer;}
  .qm-btn:hover{border-color:var(--extended);}
  @media (max-width:700px){ .qm-det .ab{grid-template-columns:1fr;} }
  .qm-foot{font-size:11px; color:var(--text-faint); line-height:1.5; margin:10px 0 0;}
  .qm-foot b{color:var(--text-dim); font-weight:600;}
  /* insight cards: four to a row, and five as three plus two, so no card is left on its own */
  .val-insights{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:10px; margin:6px 0 4px;}
  .val-insights > *{grid-column:span 3;}
  .val-insights > :first-child:nth-last-child(5), .val-insights > :first-child:nth-last-child(5) ~ *{grid-column:span 4;}
  .val-insights > :first-child:nth-last-child(5) ~ :nth-child(n+4){grid-column:span 6;}
  .val-insights > :first-child:nth-last-child(3), .val-insights > :first-child:nth-last-child(3) ~ *{grid-column:span 4;}
  @media (max-width:980px){ .val-insights > *{grid-column:span 6 !important;} .val-insights > :last-child:nth-child(odd){grid-column:1 / -1 !important;} }
  @media (max-width:600px){ .val-insights > *{grid-column:1 / -1 !important;} }
  .val-ins{background:var(--panel); border:1px solid var(--hairline); border-left:3px solid var(--core); border-radius:2px; padding:11px 13px;}
  .val-ins h6{margin:0 0 5px; font-size:12.5px; font-weight:700; color:var(--text);}
  .val-ins p{margin:0; font-size:12px; line-height:1.5; color:var(--text-dim);}
  .val-ins .go{margin-top:7px; font-size:10.5px; color:var(--extended); cursor:pointer; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

  /* status + timeline */
  .val-status{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr)); gap:10px;}
  .val-st{background:var(--panel); border:1px solid var(--hairline); border-radius:3px; padding:11px 13px;}
  .val-st .s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; letter-spacing:0.06em; padding:2px 6px; border-radius:2px; display:inline-block; margin-bottom:6px;}
  .val-st .s.done{color:var(--hm-g-t); border:1px solid rgba(74,222,128,0.5);}
  .val-st .s.part{color:var(--hm-o-t); border:1px solid rgba(245,158,11,0.5);}
  .val-st .s.open{color:var(--text-faint); border:1px solid var(--hairline);}
  .val-st .t{font-size:12.5px; font-weight:600;}
  .val-st .d{font-size:11.5px; color:var(--text-dim); line-height:1.45; margin-top:4px;}
  .tl{border-left:2px solid var(--hairline); margin:6px 0 0 6px; padding-left:18px;}
  .tl-i{position:relative; padding:5px 0 9px;}
  .tl-i::before{content:""; position:absolute; left:-24px; top:10px; width:10px; height:10px; border-radius:50%;
    background:var(--bg); border:2px solid var(--text-faint);}
  .tl-i.done::before{background:var(--hm-g); border-color:var(--hm-g);}
  .tl-i.now::before{background:var(--core); border-color:var(--core);}
  .tl-i .w{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; color:var(--text-faint); letter-spacing:0.04em;}
  .tl-i .a{font-size:12.5px; color:var(--text); font-weight:600;}
  .tl-i .x{font-size:11.5px; color:var(--text-dim); line-height:1.45;}

  /* priority changes since the submission, inside fit */
  .pc-panel{margin-top:26px; border:1px solid var(--hairline); border-radius:4px; background:var(--panel); padding:16px 18px;}
  .pc-panel h3{font-size:15px; margin:0 0 4px;}
  .pc-bars{margin:12px 0 10px; max-width:560px;}
  .pc-list{display:none; margin-top:10px;}
  .pc-list.open{display:block;}
  .pc-item{display:grid; grid-template-columns:70px 150px 1fr; gap:10px; padding:5px 0; border-bottom:1px solid var(--hairline); font-size:12px; align-items:baseline;}
  .pc-item:last-child{border-bottom:none;}
  .pc-item .r{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:var(--text-dim);}
  .pc-item .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; color:var(--text-faint);}
  .pc-item .m b{color:var(--oos); font-weight:600;}
  .pc-item .m b.sh{color:var(--fg2);}
  .pc-item .q{color:var(--text); line-height:1.4;}
  .pc-top{display:grid; grid-template-columns:1.1fr 0.9fr; gap:28px; margin-top:14px;}
  .pc-top > *{min-width:0;}
  @media (max-width:860px){ .pc-top{grid-template-columns:1fr;} }
  .pc-lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:0.08em; color:var(--text-dim); margin:0 0 8px;}
  .pc-lbl span{color:var(--text-faint); letter-spacing:0.02em; margin-left:8px;}
  .pc-bars{margin:0; max-width:none;}
  button.pc-bar{width:100%; background:transparent; border:1px solid transparent; border-radius:3px; padding:4px 6px; cursor:pointer; font-family:inherit; text-align:left;}
  button.pc-bar:hover{border-color:var(--hairline); background:var(--panel-2);}
  button.pc-bar.active{border-color:var(--fg2); background:rgba(245,158,11,0.08);}
  button.pc-bar.active .t{color:var(--text);}
  .pc-bars.filtering button.pc-bar:not(.active){opacity:0.45;}
  .pc-themes{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr)); gap:10px;}
  .pc-theme{background:var(--panel-2); border:1px solid var(--hairline); border-left:3px solid var(--extended); border-radius:2px; padding:12px 14px; display:flex; flex-direction:column;}
  .pc-theme.active{border-color:var(--extended); box-shadow:0 0 0 1px rgba(56,189,248,0.35);}
  .pc-theme h6{margin:0 0 6px; font-size:13px; font-weight:700; color:var(--text);}
  .pc-theme p{margin:0 0 10px; font-size:12px; line-height:1.55; color:var(--text-dim);}
  .pc-theme p b{color:var(--text);}
  .pc-today{display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-bottom:10px;}
  .pc-today > span{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:9.5px; letter-spacing:0.06em; color:var(--text-faint); margin-right:4px;}
  .pc-sys{font-family:inherit; font-size:11px; padding:2px 7px; border-radius:2px; cursor:pointer; background:var(--panel); color:var(--text-dim); border:1px solid var(--hairline);}
  .pc-sys:hover{color:var(--text); border-color:var(--text-dim);}
  .pc-show{margin-top:auto; align-self:flex-start; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; cursor:pointer;
    background:transparent; color:var(--extended); border:1px solid rgba(56,189,248,0.4); border-radius:3px; padding:5px 10px;}
  .pc-show:hover{background:rgba(56,189,248,0.1);}
  .pc-listhead{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:24px 0 8px; padding-bottom:8px;
    border-bottom:1px solid var(--hairline); font-size:13px; font-weight:600; scroll-margin-top:16px;}
  .pc-clear{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; cursor:pointer; background:transparent;
    color:var(--text-dim); border:1px solid var(--hairline); border-radius:3px; padding:4px 9px;}
  .pc-clear:hover{color:var(--text); border-color:var(--text-dim);}
  .pc-group{margin:14px 0 6px;}
  .pc-group .fg-group-head{margin-bottom:4px;}
  .pc-item .q{display:flex; flex-direction:column; gap:4px;}
  .pc-meta{display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
  .pc-sub{font-size:10.5px; color:var(--text-faint); margin-right:4px;}
  .pc-asked{font-size:10px; color:var(--text-faint);}
  .pc-site{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; padding:1px 6px; border-radius:2px; color:var(--text-dim); border:1px solid var(--hairline);}
  .pc-site.em{color:var(--core); border-color:rgba(242,153,74,0.5);}
  .pc-tag{font-family:inherit; font-size:10.5px; padding:1px 7px; border-radius:2px; cursor:pointer; background:transparent; color:var(--extended); border:1px solid rgba(56,189,248,0.35); margin-left:auto;}
  .pc-tag:hover{background:rgba(56,189,248,0.1);}
  .pc-note{font-size:11px; color:var(--text-faint); font-style:italic;}
  @media (max-width:640px){ .pc-tag{margin-left:0;} .pc-themes{grid-template-columns:1fr;} }
  @media (max-width:640px){ .pc-item{grid-template-columns:1fr;} .hbar{grid-template-columns:110px 1fr 40px;} }

  /* ---- previous / next view (shared) ---- */
  .pager{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:40px 0 0; padding-top:20px; border-top:1px solid var(--hairline);}
  .pg{display:flex; flex-direction:column; gap:3px; min-height:44px; padding:12px 16px; border-radius:6px; border:1px solid var(--hairline);
    background:var(--panel); color:inherit; text-decoration:none; transition:border-color .14s, transform .14s;}
  .pg.next{text-align:right; align-items:flex-end;}
  .pg:hover{border-color:var(--accent, var(--text-dim)); transform:translateY(-1px);}
  .pg-d{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint);}
  .pg-t{font-size:14px; font-weight:650; line-height:1.3;}
  .pg-t .n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:var(--accent, var(--text-faint)); margin-right:7px;}
  @media (max-width:560px){ .pager{grid-template-columns:1fr;} .pg.next{text-align:left; align-items:flex-start;} }

  /* cross-page links out of the system-card modal */
  .ev-link{color:var(--extended); text-decoration:none; border-bottom:1px solid rgba(56,189,248,0.4);}
  .ev-link:hover{color:var(--text); border-bottom-color:currentColor;}


/* capability reference: what the proposed product documents for a system, step or requirement */
.cap{background:var(--panel-2); border:1px solid var(--hairline); border-left:3px solid var(--extended); border-radius:3px;
  padding:11px 13px; margin:16px 0; font-size:12px; line-height:1.5; color:var(--text-dim);}
.cap p{margin:0 0 6px;}
.cap-h{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 10px; margin-bottom:7px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:0.07em; color:var(--extended); font-weight:600;}
.cap-b{font-size:10px; letter-spacing:0.03em; padding:2px 7px; border-radius:2px; border:1px solid currentColor; text-transform:uppercase; white-space:nowrap;}
.cap-b.ok{color:var(--hm-g-t);} .cap-b.part{color:var(--hm-o-t);} .cap-b.int{color:var(--extended);}
.cap-b.none{color:var(--text-dim); border-style:dashed;}
.cap-gap b{color:var(--text); font-weight:600;}
.cap-q{font-style:italic; color:var(--text-dim);}
.cap-q cite{display:block; font-style:normal; font-size:10.5px; color:var(--text-faint); margin-top:2px;}
.cap-mini{font-size:11.5px; line-height:1.5; color:var(--text-dim);}
.cap-mini summary{display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px; cursor:pointer; list-style:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; letter-spacing:0.04em; color:var(--extended);}
.cap-mini summary::-webkit-details-marker{display:none;}
.cap-mini summary::before{content:'\25B8'; font-size:9px;}
.cap-mini[open] summary::before{content:'\25BE';}
.cap-mini summary .k{font-weight:600; text-transform:uppercase;}
.cap-mini summary .cap-b{font-size:9px; padding:1px 5px;}
.cap-mini summary .p{color:var(--text-faint);}
.cap-mini[open]{background:var(--panel-2); border-left:2px solid var(--extended); border-radius:0 3px 3px 0; padding:6px 10px; margin-top:2px;}
.cap-mini p{margin:5px 0 0;}
blockquote.ev .cap-mini{margin-top:7px;}
.cap-mods{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 8px;}
.cap-mods span{font-size:11px; padding:2px 7px; border-radius:2px; border:1px solid var(--hairline); background:var(--panel); color:var(--text);}

/* maturity matrix: disclosure button, site toggles */
.qm-toggle{font:inherit; font-weight:600; color:var(--text); background:none; border:0; padding:0 0 0 14px; text-indent:-14px; text-align:left; cursor:pointer; display:block;}
.qm-sitebar{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 10px; font-size:11.5px; color:var(--text-dim);}
.qm-st[aria-pressed="false"]{color:var(--text-faint); border-style:dashed; text-decoration:line-through;}
.qm-caveat{font-size:11.5px; color:var(--text-dim); margin:0 0 8px; line-height:1.5;}

/* visible keyboard focus on every control, including SVG diagram nodes */
:focus-visible{outline:2px solid var(--extended); outline-offset:2px; border-radius:2px;}
g.node:focus-visible{outline-offset:3px;}

/* view switcher in the page bar: numbered links on wide screens, a drop-down on narrow ones */
.viewnav{flex:1 1 auto; display:flex; justify-content:center; min-width:0;}
.vn-links{display:flex; flex-wrap:wrap; justify-content:center; gap:2px;}
.vn{display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 10px; border-radius:4px; border:1px solid transparent;
  font-size:12px; color:var(--text-dim); text-decoration:none; white-space:nowrap;}
.vn .n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; color:var(--accent);}
.vn:hover{color:var(--text); background:var(--panel);}
.vn[aria-current="page"]{color:var(--text); background:var(--panel); border-color:var(--hairline); font-weight:600;}
.vn-select{display:none; align-items:center; gap:8px; font-size:11.5px; color:var(--text-dim); min-width:0;}
.vn-select select{font:inherit; font-size:12.5px; color:var(--text); background:var(--panel); border:1px solid var(--hairline);
  border-radius:4px; min-height:40px; padding:0 8px; max-width:100%; min-width:0;}
@media (max-width:1180px){
  .vn-links{display:none;}
  .vn-select{display:inline-flex;}
}
@media (max-width:560px){
  .pagenav{flex-wrap:nowrap; gap:6px;}
  .viewnav{flex:1 1 0; justify-content:stretch;}
  .vn-select{flex:1; min-width:0;} .vn-select > span{display:none;}
  .vn-select select{flex:1; width:100%; text-overflow:ellipsis;}
  .home-link, .theme-toggle{padding:0 9px; flex:none;}
  .theme-toggle .tt{display:none;}
}

/* wide-table scroll cues; first column stays put in the financial tables */
.scroll-hint{display:none; font-size:11.5px; color:var(--text-dim); margin:0 0 6px;}
.scroll-hint.show{display:block;}
.val-table-wrap.can-scroll:not(.at-end){box-shadow:inset -18px 0 14px -14px rgba(0,0,0,0.45);}
.val-table th:first-child, .val-table td:first-child{position:sticky; left:0; z-index:1; background:var(--panel);}
.val-table tr:hover td:first-child{background:var(--panel-2);}

/* architecture ring: a list on phones instead of an unreadable scaled-down ring */
.target-list{display:none;}
@media (max-width:700px){
  .diagram-holder svg{display:none;}
  .target-list{display:block; padding:4px 6px;}
}
.tl-group{margin:8px 0 14px;}
.tl-head{font-size:13px; font-weight:700; color:var(--text); margin:0 0 6px; display:flex; gap:8px; align-items:baseline;}
.tl-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; color:var(--text-dim); font-weight:600;}
.tl-item{display:grid; grid-template-columns:10px 1fr; column-gap:9px; row-gap:1px; width:100%; text-align:left; font:inherit; cursor:pointer;
  background:var(--panel); border:1px solid var(--hairline); border-radius:3px; padding:9px 11px; margin:0 0 5px; color:var(--text);}
.tl-dot{grid-row:1 / span 3; width:10px; height:10px; border-radius:50%; margin-top:4px; background:var(--stays);}
.tl-item[data-status="core"] .tl-dot{background:var(--core);}
.tl-item[data-status="extended"] .tl-dot{background:transparent; border:2px dashed var(--extended);}
.tl-n{font-size:13px; font-weight:600;}
.tl-d{font-size:12px; color:var(--text-dim);}
.tl-s{font-size:11px; color:var(--text-dim);}

/* "more detail" disclosures that keep introductions short */
details.more{margin:6px 0 14px; max-width:900px;}
details.more > summary{cursor:pointer; font-size:12px; color:var(--extended); padding:7px 0;}
.legend-note .badge-oos, .tl-n .badge-oos{display:inline-block; vertical-align:middle;}
details.more > summary::marker{color:var(--text-dim);}
details.more[open] > summary{margin-bottom:4px;}

/* headline numbers in one row on phones */
@media (max-width:560px){
  .stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; padding:10px 0 14px;}
  .stats .stat .n{font-size:22px;}
  .stats .stat .l{font-size:9.5px; letter-spacing:0.02em; line-height:1.3; overflow-wrap:normal; hyphens:auto;}
  .stats:has(> :nth-child(5)){grid-template-columns:repeat(3,minmax(0,1fr)); row-gap:12px;}
}

/* ============================================================================
   02 · Process flow — phases, steps and the step detail
   ========================================================================== */
.flow{display:grid; grid-template-columns:var(--flow-cols, repeat(5,1fr)); gap:14px; align-items:stretch; margin:6px 0 0;}
.fl-phase{--ph:var(--text-dim); position:relative; min-width:0; display:flex; flex-direction:column;
  background:var(--panel); border:1px solid var(--hairline); border-top:3px solid var(--ph); border-radius:6px; padding:10px 10px 11px;}
.fl-phase:not(:last-child)::after{content:''; position:absolute; top:50%; right:-11px; width:8px; height:8px; margin-top:-4px;
  border-top:2px solid var(--text-faint); border-right:2px solid var(--text-faint); transform:rotate(45deg);}
.fl-phase.upstream{border-style:dashed; border-top-style:solid;}
.fl-ph-h{display:flex; flex-direction:column; gap:1px; margin:0 2px 9px; min-height:30px;}
.fl-ph-h b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; font-weight:600; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--ph);}
.fl-ph-h span{font-size:11px; color:var(--text-faint);}
.fl-steps{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px; flex:1;}
.fl-step{font:inherit; text-align:left; cursor:pointer; min-width:0; display:flex; flex-direction:column; gap:5px;
  padding:10px 10px 11px; border-radius:5px; border:1px solid var(--hairline); background:var(--panel-2); color:var(--text);
  transition:border-color .14s, background .14s, transform .14s;}
.fl-step .n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; font-weight:600; color:var(--ph);}
.fl-step .t{font-size:13px; font-weight:600; line-height:1.3;}
.fl-step:hover{border-color:var(--ph); transform:translateY(-1px);}
.fl-step:focus-visible{outline:2px solid var(--ph); outline-offset:2px;}
.fl-step[aria-pressed="true"]{border-color:var(--ph); background:color-mix(in srgb, var(--ph) 16%, var(--panel)); box-shadow:inset 0 0 0 1px var(--ph);}

.fd{--ph:var(--text-dim); margin-top:18px; background:var(--panel); border:1px solid var(--hairline); border-top:3px solid var(--ph);
  border-radius:6px; padding:20px 24px 22px; scroll-margin-top:84px;}
.fd-top{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:10px 18px;}
.fd-k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ph);}
.fd h2{font-size:21px; font-weight:700; letter-spacing:-0.01em; margin:4px 0 0;}
.fd-codes{display:flex; flex-wrap:wrap; gap:6px;}
.fd-codes span{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; color:var(--text-dim);
  border:1px solid var(--hairline); border-radius:3px; padding:3px 8px; white-space:nowrap;}
.fd-what{font-size:14.5px; line-height:1.6; color:var(--text); max-width:900px; margin:12px 0 20px;}
.fd-grid{display:grid; grid-template-columns:1fr 1fr; gap:26px; align-items:start;}
.fd-grid > *{min-width:0;}
.fd h3{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; font-weight:600; letter-spacing:0.1em;
  color:var(--text-faint); margin:0 0 10px;}
.fd-q{margin:0 0 8px; padding:9px 12px; border-left:2px solid var(--ph); background:var(--panel-2); border-radius:0 4px 4px 0;
  font-size:12.5px; line-height:1.55; color:var(--text);}
.fd-q cite{display:block; margin-top:4px; font-style:normal; font-size:10.5px; color:var(--text-faint);}
.fd-site{display:grid; grid-template-columns:118px 1fr; gap:10px; align-items:baseline; padding:9px 0; border-top:1px solid var(--hairline);}
.fd-site:first-of-type{border-top:0; padding-top:2px;}
.fd-site .l{font-size:12px; color:var(--text-dim);}
.fd-chips{display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
.fd-chip{font:inherit; font-size:12px; font-weight:500; line-height:1.2; padding:5px 9px; border-radius:3px; cursor:pointer;
  border:1px solid var(--hairline); border-left:3px solid var(--stays); background:var(--panel-2); color:var(--text);
  display:inline-flex; align-items:center; gap:6px;}
.fd-chip[data-status="core"]{border-left-color:var(--core);}
.fd-chip[data-status="extended"]{border-left-color:var(--extended);}
.fd-chip:hover{border-color:var(--text-dim);}
.fd-chip:focus-visible{outline:2px solid var(--extended); outline-offset:1px;}
.fd-none{font-size:12px; color:var(--text-faint); font-style:italic;}
.fd-legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:11px; color:var(--text-faint);}
.fd-legend i{display:inline-block; width:3px; height:11px; vertical-align:-1px; margin-right:5px;}
.fd-reqs{margin-top:22px;}
.fd-req{display:grid; grid-template-columns:64px 1fr; gap:4px 12px; padding:11px 0; border-top:1px solid var(--hairline);}
.fd-req .ref{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; color:var(--text-dim); padding-top:1px;}
.fd-req .t{font-size:13px; line-height:1.5;}
.fd-tags{grid-column:2; display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
.fd-tag{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; letter-spacing:0.04em; text-transform:uppercase;
  padding:2px 7px; border-radius:2px; border:1px solid var(--hairline); color:var(--text-dim); white-space:nowrap;}
.fd-tag.must{color:var(--oos); border-color:currentColor;}
.fd-tag.ex{color:var(--fg2); border-color:currentColor;}
.fd-tag.up{color:var(--text);}
.fd-site-note{grid-column:2; font-size:11.5px; color:var(--text-faint); font-style:italic;}
.fd-req .cap-mini{grid-column:2;}
.fd .cap{margin-top:22px;}
.fd-nav{display:flex; justify-content:space-between; gap:10px; margin-top:20px; padding-top:14px; border-top:1px solid var(--hairline);}
.fd-nav button{font:inherit; font-size:12.5px; color:var(--text-dim); background:transparent; border:1px solid var(--hairline);
  border-radius:4px; min-height:40px; padding:0 14px; cursor:pointer;}
.fd-nav button:hover{color:var(--text); border-color:var(--text-dim);}
.fd-nav button[hidden]{visibility:hidden; display:block;}

@media (max-width:1100px){
  .flow{grid-template-columns:1fr 1fr;}
  .fl-phase.upstream{grid-column:1 / -1;}
  .fl-phase.upstream .fl-steps{grid-auto-flow:row; grid-auto-columns:auto; grid-template-columns:minmax(0,260px);}
  .fl-phase:not(:last-child)::after{display:none;}
}
@media (max-width:820px){ .fd-grid{grid-template-columns:1fr;} }
@media (max-width:600px){
  .flow{grid-template-columns:1fr; gap:10px;}
  .fl-steps{grid-auto-flow:row; grid-template-columns:1fr;}
  .fl-phase.upstream .fl-steps{grid-template-columns:1fr;}
  .fl-step{flex-direction:row; align-items:baseline; gap:10px; padding:11px 12px;}
  .fl-ph-h{flex-direction:row; align-items:baseline; gap:8px; min-height:0;}
  .fd{padding:16px 16px 18px;}
  .fd h2{font-size:19px;}
  .fd-site{grid-template-columns:1fr; gap:6px;}
  .fd-req{grid-template-columns:1fr;}
  .fd-tags, .fd-site-note, .fd-req .cap-mini{grid-column:1;}
}

/* the system card's link into the flow */
.flow-mod-chips{display:flex; flex-wrap:wrap; gap:6px;}
.flow-mod-chip{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim); text-decoration:none;
  border:1px solid var(--hairline); border-radius:3px; padding:5px 10px; background:var(--panel-2);}
.flow-mod-chip b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; color:var(--extended);}
.flow-mod-chip:hover{color:var(--text); border-color:var(--text-dim);}

/* ---- "possibly incorrect" flag: red highlight, reason in a popover (SITE.flag in site.js) ---- */
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
.ui-flag{cursor:pointer; border-radius:3px; padding:0 3px; margin:0 -1px;
  background:color-mix(in srgb, var(--hm-r) 16%, transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--hm-r) 75%, transparent);
  -webkit-box-decoration-break:clone; box-decoration-break:clone;}
.ui-flag:hover, .ui-flag[aria-expanded="true"]{background:color-mix(in srgb, var(--hm-r) 28%, transparent);}
.ui-flag:focus-visible{outline:2px solid var(--hm-r); outline-offset:2px;}
.ui-flag > i{font-style:normal; display:inline-flex; align-items:center; justify-content:center; width:13px; height:13px;
  margin-left:4px; border-radius:50%; background:var(--hm-r); color:#fff; vertical-align:1px;
  font:800 9px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.ui-flag .m-tag{border-color:transparent !important; color:var(--hm-r-t) !important; padding-left:2px; padding-right:2px;}
.ui-flag-pop{position:absolute; z-index:2100; width:max-content; max-width:min(340px, calc(100vw - 32px));
  background:var(--panel); color:var(--text); border:1px solid var(--hm-r); border-left-width:3px; border-radius:4px;
  box-shadow:0 12px 32px rgba(0,0,0,0.35); padding:9px 12px 11px; font-size:12.5px; line-height:1.5; text-align:left;
  font-family:inherit; font-weight:400; letter-spacing:normal; white-space:normal;}
.ui-flag-pop .h{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:4px;
  font:600 10px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:0.08em; color:var(--hm-r-t);}

.ui-flag-pop .x:hover{color:var(--text);}
.ui-flag-pop p{margin:0;}
.flag-key{display:inline-flex; align-items:center; gap:7px;}

/* ---- site decisions: what happens to each system at one site ---- */
.rv-k{display:inline-block; font:600 10px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:0.06em;
  text-transform:uppercase; padding:2px 7px; border-radius:3px; border:1px solid currentColor; color:var(--text-dim);}
.rv-k.out{color:var(--hm-r-t);} .rv-k.split, .rv-k.move{color:var(--hm-o-t);} .rv-k.shared, .rv-k.open{color:var(--extended);}
.rv-k.stays, .rv-k.replace{color:var(--hm-g-t);}
.rv-k .ui-flag{margin-left:-4px;}
.rv{background:var(--panel); border:1px solid var(--hairline); border-radius:4px; padding:16px 18px; margin:0 0 22px;}
.rv-h{font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:0.1em; color:var(--text-dim); margin:0 0 6px;}
.rv-lede{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin:0 0 12px; max-width:980px;}
.rv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr)); gap:12px;}
.rv-grp .rv-k{margin-bottom:7px;}
.rv-grp .sys{display:flex; flex-wrap:wrap; gap:5px;}
.rv-grp .sys button{font:inherit; font-size:12px; padding:3px 8px; border-radius:3px; cursor:pointer;
  background:var(--panel-2); border:1px solid var(--hairline); color:var(--text);}
.rv-grp .sys button:hover{border-color:var(--text-dim);}

/* ---- value heat map: site switcher, cross-site comparison, tools outside the landscape ---- */
.hm-sites{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px;}
.hm-site-tab{font:inherit; font-size:12.5px; padding:8px 14px; border-radius:3px; cursor:pointer;
  border:1px solid var(--hairline); background:transparent; color:var(--text-dim); text-align:left; line-height:1.3;}
.hm-site-tab b{display:block; color:inherit; font-weight:650;}
.hm-site-tab small{font-size:10.5px; color:var(--text-faint); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.hm-site-tab:hover{color:var(--text); border-color:var(--text-dim);}
.hm-site-tab[aria-pressed="true"]{color:var(--text); background:var(--panel); border-color:var(--extended); box-shadow:inset 0 -2px 0 var(--extended);}
.hm-cmp{width:100%; border-collapse:collapse; font-size:12px; min-width:560px;}
.hm-cmp th{font:600 10px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:0.06em; color:var(--text-faint);
  text-align:left; padding:8px 10px; border-bottom:1px solid var(--hairline); background:var(--panel-2);}
.hm-cmp td{padding:6px 10px; border-bottom:1px solid var(--hairline); vertical-align:middle;}
.hm-cmp tr:last-child td{border-bottom:none;}
.hm-cmp td.a{font-weight:600; color:var(--text);}
.hm-cmp td.a small{display:block; font-weight:400; font-size:10.5px; color:var(--text-faint); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.hm-cmp button{font:inherit; background:none; border:0; padding:0; cursor:pointer; color:inherit; text-align:left; width:100%;}
.hm-cmp .cell{display:flex; align-items:center; gap:8px;}
.hm-cmp .bar{flex:1; height:8px; min-width:40px; max-width:120px; background:var(--panel-2); border-radius:2px; overflow:hidden; display:flex;}
.hm-cmp .bar span{display:block; height:100%;}
.hm-cmp .bar .H{background:var(--core);} .hm-cmp .bar .M{background:var(--hm-o); opacity:0.55;} .hm-cmp .bar .L{background:var(--text-faint); opacity:0.5;}
.hm-cmp .n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:var(--text); white-space:nowrap;}
.hm-cmp .n.none{color:var(--text-faint);}
.hm-cmp tr.tot td{font-weight:700; background:var(--panel-2);}
.hm-cmp button:hover .n{color:var(--extended);}
.hm-extra{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr)); gap:6px 18px; margin:0;}
.hm-extra div{font-size:12px; color:var(--text-dim); line-height:1.4; padding:4px 0; border-bottom:1px solid var(--hairline);}
.hm-extra b{color:var(--text); font-weight:600;}
.hm-none{font-size:12px; color:var(--text-faint); font-style:italic; margin:0;}

/* ---- folds (SITE.fold): long tables a viewer can minimise; closed, the header keeps a summary ---- */
.ui-fold{border:1px solid var(--hairline); border-radius:4px; background:var(--panel); padding:0 16px; margin:28px 0 0;}
.ui-fold > summary{list-style:none; cursor:pointer; display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px; padding:13px 0 12px 22px; position:relative;}
.ui-fold > summary::-webkit-details-marker{display:none;}
.ui-fold > summary::before{content:""; position:absolute; left:2px; top:17px; width:7px; height:7px;
  border-right:2px solid var(--text-dim); border-bottom:2px solid var(--text-dim); transform:rotate(-45deg); transition:transform .15s;}
.ui-fold[open] > summary::before{transform:rotate(45deg); top:15px;}
.ui-fold > summary:focus-visible{outline:2px solid var(--extended); outline-offset:2px; border-radius:3px;}
.ui-fold-t{font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:0.1em; color:var(--text-dim);}
.ui-fold > summary:hover .ui-fold-t{color:var(--text);}
.ui-fold-sum{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12px; color:var(--text-dim);}
.ui-fold-sum b{color:var(--text); font-weight:650;}
.ui-fold[open] .ui-fold-sum{display:none;}
.ui-fold-b{padding-bottom:16px;}
.ui-fold-b > :first-child{margin-top:0;}
/* flat: a fold that sits inside a panel already — a hairline instead of a box */
.ui-fold.flat{border:0; border-top:1px solid var(--hairline); border-radius:0; background:transparent; padding:0; margin:14px 0 0;}
.ui-fold.flat > summary{padding:11px 0 10px 20px;}
.ui-fold.flat > summary::before{top:15px;}
.ui-fold.flat[open] > summary::before{top:13px;}
.ui-fold.flat .ui-fold-t{font-size:10.5px; letter-spacing:0.08em; color:var(--text-faint);}
.ui-fold.flat .ui-fold-b{padding-bottom:4px;}
.hm-cmp .bar .X{background:var(--hm-r); opacity:0.75;}
.hm-cmp .n b{font-weight:700;}
.hm-cmp tr.tot .bar{background:var(--hairline);}
.hm-sum + .ui-fold.flat{border-top:0; margin-top:0;}
.pc-panel .ui-fold.flat{margin-top:24px;}
.pc-panel .ui-fold.flat .pc-listhead{margin-top:4px;}


/* a process-area title that opens more detail (01) */
.area-info{font:inherit; font-size:16px; font-weight:600; color:var(--text); background:none; border:0; padding:0; cursor:pointer;

/* concerns by step, on 02 */
.fl-q{display:inline-block; align-self:flex-start; width:auto; margin-top:auto; font:600 9.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:0.06em;

.fd-qual-lede{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin:0 0 12px; max-width:900px;}

:root{--hmonly-bg:rgba(250,204,21,0.10); --hmonly-bd:rgba(250,204,21,0.40); --hmonly-edge:#EAB308; --hmonly-t:#FACC15;}

body:not([data-filter="all"]) .hm-card{display:none;}

/* ---- a view still waiting for its documents, or one the data could not draw ---- */
.pending{background:var(--panel); border:1px dashed var(--hairline); border-left:3px solid var(--text-faint); border-radius:4px;
  padding:16px 18px; margin:18px 0; max-width:820px;}

.pending-k{display:inline-block; font:600 10.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:0.1em;
  color:var(--text-faint); margin-bottom:6px;}

.pending p{margin:0 0 6px; font-size:13px; line-height:1.55; color:var(--text-dim);}

main{display:block;}

/* fit: a requirement that cannot be met, and the scores' pills */
.fg-card[data-score="0"]{border-left-color:var(--oos);}
.fg-pill.s0{color:var(--oos); border:1px solid var(--oos);}
.modal[data-score="0"]{border-top-color:var(--oos);}
/* maturity matrix: a short note under a process name */
.qm-note{display:block; margin-top:5px; font-weight:400; font-size:11px; line-height:1.45; color:var(--text-dim);}

": "The ERP all four plants run on: release frozen since about 2006, modified in every module, run in 5250 greenscreen.", "strengths": ["Runs close to 24/7 on three iSeries systems (development, test, production)", "Almost all sources are available"], "weaknesses": ["No active developers or system support left", "No modern interfaces such as REST or API", "All plants sit under one company code, so no plant is visible on its own"]}, "Autoex": {"context": "EDI monitor for the EDI messages that reach XPPS.", "strengths": ["Release is current", "Inventory expects the CSA standard to cover it"], "weaknesses": ["The inventory states no weakness; to confirm in the scoping days"]}, "Seeburger": {"context": "Central EDI platform: XPPS sees one trading partner, behind it about 200.", "strengths": ["Described as the standard for all ERPs", "One interface for about 200 partners"], "weaknesses": ["Missing from the inventory, so its role after CSA is not stated", "Partner mappings sit outside XPPS"]}, "Salesforce": {"context": "CRM at Plant 5. Leads are mapped into XPPS fields by hand; a project now turns leads into XPPS quotes with an AI agent.", "strengths": ["A project already creates XPPS quotes from leads", "Planned to move into CSA opportunity management"], "weaknesses": ["No interface to XPPS", "Marked as equipment and needing review"]}, "Catalog Creator": {"context": "Lets customers view built machines and order spare parts. VAS creates the machine BOM, an Excel is generated from it and handed to the tool.", "strengths": ["Customers can order spare parts themselves", "Interface is on the interface list"], "weaknesses": ["An Excel step sits between VAS and the tool", "Interface rated Medium complexity"]}, "Camos Configurator": {"context": "Product configurator, replaced by Windchill and no longer used.", "strengths": ["Retired, so there is no live use to migrate"], "weaknesses": ["Still listed with a future-landscape note to analyse in detail"]}, "Supply Plus": {"context": "Connects outside suppliers to XPPS for the extended workbench (subcontracting) and sequencing. The process list notes its replacement by the Infor supplier portal.", "strengths": ["Used at all four plants", "12 supplier-portal processes are rated relevant for Engage"], "weaknesses": ["The inventory still says to analyse in detail", "Suppliers would have to be invited and registered in the portal"]}, "BANF-App": {"context": "App for purchase requisitions from employees, with workflows and a friendly interface.", "strengths": ["Friendly interface with workflows", "Inventory expects the CSA standard to cover it"], "weaknesses": ["Master data comes from item, supplier and VAS order interfaces that must move with it"]}, "Hydra MPDV": {"context": "Builds fine planning for machines on top of XPPS’s infinite-capacity plan and reports completions back about every 10 minutes.", "strengths": ["Established two-way work order exchange", "5 planning, scheduling and MES processes are rated not relevant because of Hydra", "Also connects machines and feeds plant dashboards"], "weaknesses": ["Interface rated Medium complexity; the inventory still names Infor planning and scheduling for phase 2", "XPPS plans against infinite capacity, so scheduling depends on Hydra"]}, "Brankamp Metals": {"context": "Machine data for metals. It connects to Hydra, not to XPPS.", "strengths": ["Nothing to rebuild towards XPPS while the Hydra link holds"], "weaknesses": ["The interface has to be considered if Hydra is replaced"]}, "PTC Windchill": {"context": "Leading system for items and BOMs. It creates them in XPPS automatically.", "strengths": ["Fills about 100 of about 400 XPPS item fields automatically", "Tucker has Windchill, so the 10 Infor PLM processes are rated not relevant"], "weaknesses": ["Interface rated Medium complexity; the inventory still names Infor PLM for phase 2", "About 300 item fields are still filled another way"]}, "Docufy": {"context": "Service manuals. The inventory says the Catalog Creator now does the job.", "strengths": ["Inventory expects Infor document management to cover it"], "weaknesses": ["Unclear whether it is still in use"]}, "Viastore Small Pack WMS": {"context": "Automatic small-parts warehouse at Linden with about 12k containers or storage places.", "strengths": ["Stores containers directly and re-stores returned ones automatically", "Transport order interface exists"], "weaknesses": ["Interface rated High complexity", "It knows containers, not part numbers; XPPS knows parts, not places"]}, "Hochregal-Lager Werk 1": {"context": "High-bay warehouse of the metal plant, controlled by an RPG program on the AS/400.", "strengths": ["Runs inside the XPPS environment today"], "weaknesses": ["Possible adaptation rated High complexity", "Control logic sits in AS/400 code", "Not classified in the inventory"]}, "Hochregal-Lager Werk 3": {"context": "High-bay warehouse at Linden, own programming for XPPS.", "strengths": ["Built for XPPS and the Linden flows"], "weaknesses": ["Possible adaptation rated High complexity", "Own code to replace or integrate", "Not classified in the inventory"]}, "Hochregal-Lager Werk 5": {"context": "High-bay warehouse of the devices plant, controlled by an RPG program on the AS/400.", "strengths": ["Runs inside the XPPS environment today"], "weaknesses": ["Possible adaptation rated Medium complexity", "Control logic sits in AS/400 code", "Not classified in the inventory"]}, "Hänel-Lift": {"context": "Receives master data from XPPS, manages stock and reports it once a day.", "strengths": ["Daily stock report to XPPS", "Interface is on the interface list"], "weaknesses": ["Interface rated Medium complexity", "Not classified in the inventory"]}, "Kardex Lift Systems": {"context": "Lifts for tools and spare parts of Tucker’s own production machines. Long to medium term, Jungheinrich systems are to replace them; three Kardex lifts at Plant 5 stay.", "strengths": ["Interface to Infor planned", "Three lifts at
