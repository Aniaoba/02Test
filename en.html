<script>
/* ============================================================================
   site.js — the shared engine for every page of the engagement site.
   Loaded as a classic script after site-data.js (no modules, no fetch), so the
   pages open by double-clicking them from the file system.

   It never holds content. Everything a page shows comes from window.SITE_DATA,
   which build_site.py writes from site-data.json. This file draws the page nav,
   the hub tiles, the header and footer of each view, previous / next links,
   folds, "possibly incorrect" flags, the system-card modal and the light / dark
   theme, and offers the lookups the six views share.
   ========================================================================== */

var SITE = window.SITE || {};
SITE.data = window.SITE_DATA || null;

/* ---- defaults: optional parts of the data may be left out ---- */
(function(){
  var D = SITE.data = SITE.data || {};
  var obj = function(o, k){ if(!o[k] || typeof o[k] !== 'object') o[k] = {}; return o[k]; };
  var arr = function(o, k){ if(!Array.isArray(o[k])) o[k] = []; return o[k]; };
  var meta = obj(D, 'meta');
  meta.client = meta.client || 'Client';
  meta.product = meta.product || 'the proposed solution';
  meta.vendor = meta.vendor || 'the vendor';
  meta.eyebrow = meta.eyebrow || (meta.client + (meta.engagement ? ' · ' + meta.engagement : '')).toUpperCase();
  obj(meta, 'hub');
  obj(D, 'pages'); arr(D, 'sites'); arr(D, 'areas'); arr(D, 'systems');
  obj(D, 'profiles'); var ev = obj(D, 'evidence'); obj(ev, 'bySystem'); obj(ev, 'byArea');
  var ls = obj(D, 'landscape'); obj(ls, 'siteNotes'); obj(ls, 'target');
  var pr = obj(D, 'process'); arr(pr, 'phases'); arr(pr, 'steps'); arr(pr, 'kpis');
  var vc = obj(D, 'valueCompany'); arr(vc, 'tiles');
  var vs = obj(D, 'valueSites'); arr(vs, 'sites');
  var fit = obj(D, 'fit'); arr(fit, 'coverage'); arr(fit, 'exceptions');
  var nx = obj(D, 'next'); arr(nx, 'actions'); arr(nx, 'status');
  var lab = obj(D, 'labels');
  lab.status = Object.assign({core:'Core — replace', extended:'Extended — exploring', stays:'Stays — integrates'}, lab.status || {});
  lab.score = Object.assign({3:'Out of the box', 2:'Customisation', 1:'Bolt-on', 0:'Cannot be met'}, lab.score || {});
  lab.scoreNote = Object.assign({
    3:'Standard feature; standard configuration may be required.',
    2:'Needs customisation — changes to standard code.',
    1:'Needs an additional system or bolt-on.',
    0:'Cannot be met.'
  }, lab.scoreNote || {});
})();

/* ---- the six views, in one place: the hub tiles, the top nav and every page's
   previous / next links are all rendered from this. Titles and tile text come from
   SITE_DATA.pages; d is the tile's headline content, not a description of the page. ---- */
SITE.PAGES = [
  {k:'valueCompany', n:'01', href:'03-value-company.html', accent:'var(--fg3)',      t:'Value by plant',                s:'Value by plant'},
  {k:'valueSites',   n:'02', href:'04-value-sites.html',   accent:'var(--fg2)',      t:'Heat maps by plant',            s:'Heat maps'},
  {k:'process',      n:'03', href:'02-process.html',       accent:'var(--extended)', t:'Process spine and rollout',     s:'Process spine'},
  {k:'sizing',       n:'04', href:'07-sizing.html',        accent:'var(--fg1)',      t:'Scope and sizing',              s:'Scope & sizing'},
  {k:'delivery',     n:'05', href:'08-delivery.html',      accent:'var(--core)',     t:'Delivery risk and roles',       s:'Risk & roles'},
  {k:'next',         n:'06', href:'06-next-steps.html',    accent:'var(--teal)',     t:'Decision calendar',             s:'Decision calendar'},
  {k:'landscape',    n:'07', href:'01-landscape.html',     accent:'var(--stays)',    t:'System landscape (reference)',  s:'Landscape'}
].map(function(p){
  var c = SITE.data.pages[p.k] || (SITE.data[p.k] && SITE.data[p.k].page) || {};
  return Object.assign(p, {
    t: c.title || p.t, s: c.short || p.s, d: c.tile || '', foot: c.tileFoot || '',
    sub: c.sub || '', sources: c.sources || '', pending: c.pending || ''
  });
});
SITE.page = function(k){ return SITE.PAGES.filter(function(p){ return p.k === k; })[0]; };

/* ---- small helpers shared by every view ---- */
SITE.esc = function(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
SITE.poss = function(t){ t = String(t == null ? '' : t); return SITE.esc(t) + (/s$/i.test(t) ? '&rsquo;' : '&rsquo;s'); };
SITE.fmt = function(v){ return Number(v).toLocaleString('en-GB'); };
SITE.pct = function(a, b){ return b ? (100 * a / b).toFixed(1) + '%' : '—'; };
SITE.slug = (SITE.data.meta.client || 'site').toLowerCase().replace(/[^a-z0-9]+/g, '-');
SITE.site = function(k){ return SITE.data.sites.filter(function(s){ return s.key === k; })[0] || {key:k, label:k, short:k}; };
SITE.siteShort = function(k){ var s = SITE.site(k); return s.short || s.label; };
SITE.area = function(k){ return SITE.data.areas.filter(function(a){ return a.key === k; })[0] || {key:k, code:'', title:k}; };
SITE.areaLabel = function(k){ var a = SITE.area(k); return (a.code ? a.code + ' · ' : '') + a.title; };
SITE.statusLabel = function(s){ return SITE.data.labels.status[s] || s; };
SITE.findSystem = function(name, site, area){
  return SITE.data.systems.filter(function(d){
    return d.name === name && (!site || d.site === site) && (!area || d.area === area);
  })[0];
};
// Turn a page key ("fit", "process#demand") or a file name into a link.
SITE.href = function(h){
  if(!h) return '';
  var m = /^([A-Za-z]+)(#.*)?$/.exec(h), p = m && SITE.page(m[1]);
  return p ? p.href + (m[2] || '') : h;
};

/* ---- page nav: one markup, injected into <div id="pagenav"></div> ---- */
SITE.renderNav = function(){
  var slot = document.getElementById('pagenav');
  if(!slot) return;
  slot.className = 'pagenav';
  var home = slot.dataset.self === 'home';
  var here = SPA.here;
  var cur = SITE.PAGES.filter(function(p){ return p.href === here; })[0];
  var views = home ? '' :
    '<nav class="viewnav" aria-label="Views">' +
      '<div class="vn-links">' + SITE.PAGES.map(function(p){
        return '<a class="vn" style="--accent:' + p.accent + '" href="' + p.href + '"' +
               (cur === p ? ' aria-current="page"' : '') + '><span class="n">' + p.n + '</span>' + p.s + '</a>';
      }).join('') + '</div>' +
      '<label class="vn-select"><span>View</span><select id="viewSelect" aria-label="Go to view">' + SITE.PAGES.map(function(p){
        return '<option value="' + p.href + '"' + (cur === p ? ' selected' : '') + '>' + p.n + ' · ' + SITE.esc(p.t) + '</option>';
      }).join('') + '</select></label>' +
    '</nav>';
  slot.innerHTML =
    (home ? '<span></span>' : '<a class="home-link" href="index.html">&larr; Home</a>') + views +
    '<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme"></button>';
  var sel = document.getElementById('viewSelect');
  if(sel) sel.addEventListener('change', function(){ SPA.go(sel.value); });
};

/* ---- previous / next view, at the foot of every page ---- */
SITE.renderPageLinks = function(currentKey){
  var slot = document.getElementById('pageLinks');
  if(!slot) return;
  var i = SITE.PAGES.map(function(p){ return p.k; }).indexOf(currentKey);
  var prev = SITE.PAGES[i - 1], next = SITE.PAGES[i + 1];
  var link = function(p, dir){
    if(!p) return '<a class="pg ' + dir + '" href="index.html"><span class="pg-d">' + (dir === 'prev' ? '&larr; ' : '') + 'Home' + (dir === 'next' ? ' &rarr;' : '') + '</span><span class="pg-t">All seven views</span></a>';
    return '<a class="pg ' + dir + '" style="--accent:' + p.accent + '" href="' + p.href + '"><span class="pg-d">' +
      (dir === 'prev' ? '&larr; Previous' : 'Next &rarr;') + '</span><span class="pg-t"><span class="n">' + p.n + '</span>' + p.t + '</span></a>';
  };
  slot.className = 'pager';
  slot.innerHTML = link(prev, 'prev') + link(next, 'next');
};

/* ---- one view: header, footer and links from the data, then the page's own drawing.
   A view marked pending shows what it is waiting for instead; a drawing error shows
   the message rather than a blank page, so a data mistake is easy to find. ---- */
SITE.view = function(k, draw){
  var p = SITE.page(k), M = SITE.data.meta;
  document.title = M.client + ' — ' + p.t.replace(/<[^>]+>/g, '');
  var head = document.getElementById('pagehead');
  if(head) head.innerHTML = '<p class="eyebrow">' + SITE.esc(M.eyebrow) + '</p><h1>' + p.t + '</h1>' +
    (p.sub ? '<p class="sub">' + p.sub + '</p>' : '');
  var foot = document.getElementById('pagefoot');
  if(foot) foot.innerHTML = p.sources;
  SITE.renderPageLinks(k);
  var main = document.getElementById('content');
  if(p.pending){
    if(main) main.innerHTML = '<div class="pending"><span class="pending-k">PENDING</span><p>' + p.pending + '</p></div>';
    return;
  }
  try { draw(SITE.data); }
  catch(err){
    if(main) main.insertAdjacentHTML('afterbegin', '<div class="pending err"><span class="pending-k">THIS VIEW COULD NOT BE DRAWN</span><p>' +
      SITE.esc(err && err.message || err) + '</p><p>Check this view’s part of site-data.json, then run build_site.py again.</p></div>');
    if(window.console) console.error(err);
  }
};

/* ---- the hub: tiles rendered from SITE.PAGES ---- */
SITE.renderHub = function(){
  var H = SITE.data.meta.hub, M = SITE.data.meta;
  document.title = M.client + ' — ' + (H.title || 'Overview').replace(/<[^>]+>/g, '');
  var head = document.getElementById('pagehead');
  if(head) head.innerHTML = '<p class="eyebrow">' + SITE.esc(M.eyebrow) + '</p>' +
    '<h1>' + (H.title || 'The working picture, in seven views') + '</h1>' +
    (H.sub ? '<p class="sub">' + H.sub + '</p>' : '') +
    (M.updated ? '<p class="asof">Updated ' + SITE.esc(M.updated) + '</p>' : '');
  document.getElementById('tiles').innerHTML = SITE.PAGES.map(function(p){
    var inner = '<div class="t-top"><span class="t-num">' + p.n + '</span>' + (p.pending ? '<span class="t-kind">PENDING</span>' : '') + '</div>' +
      '<h2 class="t-title">' + p.t + '</h2>' +
      '<p class="t-desc">' + (p.pending || p.d) + '</p>' +
      '<div class="t-foot"><span>' + p.foot + '</span><span class="t-arrow">&rarr;</span></div>';
    return '<a class="tile' + (p.pending ? ' soon' : '') + '" style="--accent:' + p.accent + '" href="' + p.href + '">' + inner + '</a>';
  }).join('');
  var sc = document.getElementById('shortcuts');
  if(sc) sc.innerHTML = (H.shortcuts || []).length ? 'Straight to: ' + H.shortcuts.map(function(s){
    return '<a href="' + SITE.esc(SITE.href(s.href)) + '">' + s.label + '</a>';
  }).join(' &middot; ') : '';
  var fn = document.getElementById('footnote');
  if(fn) fn.innerHTML = H.footnote || '';
};

/* ---- per-site hide rules for whatever sites the data has (the site toggles on 01 and the

(function(){
  var css = SITE.data.sites.map(function(s){
    var k = String(s.key).replace(/[^A-Za-z0-9_-]/g, '');
    return 'body.hide-' + k + ' [data-site="' + k + '"], .qm.hide-' + k + ' [data-site="' + k + '"]{display:none;}';

if(!window.SITE_DATA){

/* ---- folds: long tables a viewer can minimise. SITE.fold(key, title, body, {sum, open, flat})
   returns <details class="ui-fold" data-fold="key">; static markup of the same shape works too.
   sum is shown only while closed, so a minimised table still carries its headline. Each viewer's
   choice is remembered per key on their own device; without one, `open` (default true) applies. ---- */
SITE.fold = function(key, title, body, o){
  o = o || {};

    '<summary><span class="ui-fold-t">' + title + '</span>' + (o.sum ? '<span class="ui-fold-sum">' + o.sum + '</span>' : '') + '</summary>' +
    '<div class="ui-fold-b">' + body + '</div></details>';
};
(function(){
  var key = function(d){ return 'es-fold:' + SITE.slug + ':' + d.dataset.fold; };
  var restore = function(root){

      if(v) d.open = v === 'open';
    });
  };
  // Only the viewer's own toggles are remembered, not a page opening a fold for them.
  document.addEventListener('click', function(e){
    var sm = e.target.closest && e.target.closest('details.ui-fold[data-fold] > summary');
    if(!sm) return;
    var d = sm.parentElement;
    setTimeout(function(){ try { localStorage.setItem(key(d), d.open ? 'open' : 'closed'); } catch(err) {} }, 0);
  });
  SITE.foldSaved = function(k){ try { return localStorage.getItem('es-fold:' + SITE.slug + ':' + k); } catch(e) { return null; } };
  restore(document);
  new MutationObserver(function(){ restore(document); }).observe(document.body, {childList:true, subtree:true});
})();

/* ---- "possibly incorrect": a red highlight on a figure or name that opens the reason
   when tapped or clicked. SITE.flag(html, why) wraps html; with no why it returns html as is. ---- */
SITE.flag = function(html, why){
  if(!why) return html;
  return '<span class="ui-flag" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false" data-why="' + SITE.esc(why) + '">' + html +
    '<i aria-hidden="true">!</i><span class="sr-only"> (possibly incorrect)</span></span>';
};
(function(){
  var pop = null, from = null;
  var close = function(){
    if(pop){ pop.remove(); pop = null; }
    if(from){ from.setAttribute('aria-expanded', 'false'); from = null; }
  };
  var open = function(el){
    close();
    from = el; el.setAttribute('aria-expanded', 'true');
    pop = document.createElement('div');
    pop.className = 'ui-flag-pop';
    pop.setAttribute('role', 'dialog');
    pop.setAttribute('aria-label', 'Why this may be incorrect');
    pop.innerHTML = '<div class="h">POSSIBLY INCORRECT<button type="button" class="x" aria-label="Close">&times;</button></div><p></p>';
    pop.querySelector('p').textContent = el.dataset.why;
    document.body.appendChild(pop);
    var r = el.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    var left = Math.max(16, Math.min(r.left, vw - pop.offsetWidth - 16));
    var top = r.bottom + 8;
    if(top + pop.offsetHeight > window.innerHeight - 8 && r.top - pop.offsetHeight - 8 > 8) top = r.top - pop.offsetHeight - 8;
    pop.style.left = (left + window.scrollX) + 'px';
    pop.style.top = (top + window.scrollY) + 'px';
    pop.querySelector('.x').focus({preventScroll:true});
  };
  // Capture phase, so a flag inside a clickable card opens its reason rather than the card.
  document.addEventListener('click', function(e){
    var f = e.target.closest('.ui-flag');
    if(f){ e.preventDefault(); e.stopPropagation(); if(from === f) close(); else open(f); return; }
    if(!pop) return;
    if(e.target.closest('.ui-flag-pop .x') || !e.target.closest('.ui-flag-pop')) close();
  }, true);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && pop){ var f0 = from; close(); if(f0) f0.focus(); e.stopPropagation(); return; }
    var f = e.target.closest && e.target.closest('.ui-flag');
    if(f && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); e.stopPropagation(); open(f); }
  }, true);
  window.addEventListener('resize', close);
  document.addEventListener('scroll', function(e){ if(pop && !pop.contains(e.target)) close(); }, true);
})();

/* ---- capability reference: what the proposed product's own documentation says about a

SITE.CAP_BADGE = function(fit){

/* ---- process flow lookups (rendered on 02, linked from every system card) ---- */
SITE.flowStepsFor = function(name, site){
  return SITE.data.process.steps.filter(function(s){
    var sys = s.systems || {};

    return all.indexOf(name) >= 0;
  });

/* ---- heat-map lookups (rendered on 04, linked from every system card) ---- */
SITE.HM_LVL = {R:'TOP', O:'MED', G:'STRENGTH'};
SITE.hmSite = function(k){ return SITE.data.valueSites.sites.filter(function(s){ return s.site === k; })[0]; };
SITE.hmHref = function(site, id){ return '04-value-sites.html#hm-' + site + '-' + id; };
// Systems at a site, as patterns that find them in a heat map's "tool used today" text.
SITE.hmPatterns = (function(){
  var cache = {};
  var reEsc = function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
  return function(site){
    if(cache[site]) return cache[site];
    var list = [];
    SITE.data.systems.filter(function(d){ return d.site === site; }).forEach(function(d){
      [d.name].concat(d.aliases || []).forEach(function(n){ list.push([n, d.name]); });
    });
    list.sort(function(a, b){ return b[0].length - a[0].length; });
    return (cache[site] = list.map(function(x){ return [new RegExp('(^|[^A-Za-z0-9])(' + reEsc(x[0]) + ')(?![A-Za-z0-9])', 'gi'), x[1]]; }));
  };
})();
SITE.hmToolHtml = function(tool, site){
  if(!tool) return '<span style="opacity:.55">&mdash;</span>';
  var out = String(tool).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  var hits = [];
  SITE.hmPatterns(site).forEach(function(p){
    out = out.replace(p[0], function(m, pre, word){ hits.push([p[1], word]); return pre + '\u0000' + (hits.length - 1) + '\u0000'; });
  });
  return out.replace(/\u0000(\d+)\u0000/g, function(_, i){
    return '<span class="hm-sys" data-sys="' + SITE.esc(hits[i][0]) + '" data-site="' + site + '">' + hits[i][1] + '</span>';
  });
};
SITE.hmRowsForSystem = function(name, site){
  var st = SITE.hmSite(site), rows = [];
  if(!st) return rows;
  var pats = SITE.hmPatterns(site).filter(function(p){ return p[1] === name; })
    .map(function(p){ return new RegExp(p[0].source, 'i'); });
  (st.areas || []).forEach(function(a){ (a.groups || []).forEach(function(g){ (g.rows || []).forEach(function(r){
    if(r[1] && pats.some(function(re){ return re.test(r[1]); })) rows.push({area:a.title, id:a.id, task:r[0], tool:r[1], heat:r[2] || ''});
  }); }); });
  return rows;
};

/* ---- light / dark theme: follows the OS until the toggle is used ---- */
SITE.initTheme = function(){
  var root = document.documentElement, btn = document.getElementById('themeToggle');
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  var saved = null;
  try { saved = localStorage.getItem('es-theme'); } catch(e) {}
  if(saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  if(!btn) return;
  var current = function(){ return root.getAttribute('data-theme') || (mq.matches ? 'light' : 'dark'); };
  var paint = function(){ btn.innerHTML = current() === 'dark' ? '&#9788;<span class="tt"> Light mode</span>' : '&#9790;<span class="tt"> Dark mode</span>'; };
  btn.addEventListener('click', function(){
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('es-theme', next); } catch(e) {}
    paint();
  });
  if(mq.addEventListener) mq.addEventListener('change', paint);
  paint();
};

/* ---- keyboard access for click-only controls ----
   Cards, chips, tabs and diagram nodes are divs, spans or SVG groups with delegated
   click handlers. Make each one focusable, give it a button role and its selected
   state, and let Enter/Space fire the same click. Runs again whenever a page
   re-renders, so controls drawn later are covered too. */
(function(){
  var SEL = '.card, .chip, .target-tab, .fg-card, .hm-sys[data-sys], .val-ins .go, g.node';
  var NATIVE = 'a, button, input, select, textarea, summary';
  var pressed = function(el){
    return el.matches('.chip.site') ? !el.classList.contains('inactive')
         : el.matches('.chip, .target-tab') ? el.classList.contains('active') : null;
  };
  function enhance(){
    document.querySelectorAll(SEL).forEach(function(el){
      if(el.matches(NATIVE)) return;
      if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
      if(!el.hasAttribute('role')) el.setAttribute('role', 'button');
      if(el instanceof SVGElement && !el.hasAttribute('aria-label'))
        el.setAttribute('aria-label', el.textContent.trim().replace(/\s+/g, ' '));
      var p = pressed(el);
      if(p !== null && el.getAttribute('aria-pressed') !== String(p)) el.setAttribute('aria-pressed', p);
    });
  }
  var queued = false;
  var later = function(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; enhance(); }); };
  new MutationObserver(later).observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['class']});
  enhance();
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target;
    if(!(el instanceof Element) || el.matches(NATIVE) || !el.matches(SEL)) return;
    e.preventDefault();
    el.dispatchEvent(new MouseEvent('click', {bubbles:true, cancelable:true}));
  });
})();

/* ---- dialog focus: move focus in on open, keep the page behind it inert, and return
   focus to whatever opened it on close. Watches the overlay's "open" class, so every
   opener (system cards, requirement cards, info pop-ups) gets the same behaviour. ---- */
(function(){
  var m = SITE.modal.el;
  if(!m) return;
  var back = null, active = false;
  new MutationObserver(function(){
    var open = m.classList.contains('open');
    if(open && !active){
      active = true;
      back = document.activeElement;
      Array.prototype.forEach.call(document.body.children, function(c){ if(c !== m && !c.inert){ c.inert = true; c.dataset.uiInert = '1'; } });
      m.querySelector('.modal').scrollTop = 0;
      document.getElementById('swModalClose').focus();
    } else if(!open && active){
      active = false;
      document.querySelectorAll('[data-ui-inert]').forEach(function(c){ c.inert = false; delete c.dataset.uiInert; });
      if(back && document.contains(back) && back.focus) back.focus();
      back = null;
    }
  }).observe(m, {attributes:true, attributeFilter:['class']});
})();

/* ---- scroll cues for wide tables: a hint line and an edge shadow while there is
   more to the right, gone once the table fits or is scrolled to the end ---- */
(function(){
  function cue(w){
    if(!w.previousElementSibling || !w.previousElementSibling.classList.contains('scroll-hint')){
      var h = document.createElement('p');
      h.className = 'scroll-hint';
      h.textContent = 'Wider than your screen. Swipe or scroll the table sideways →';
      w.parentNode.insertBefore(h, w);
      w.addEventListener('scroll', function(){ update(w); }, {passive:true});
    }
    update(w);
  }
  function update(w){
    var can = w.scrollWidth > w.clientWidth + 1;
    w.classList.toggle('can-scroll', can);
    w.classList.toggle('at-end', !can || w.scrollLeft + w.clientWidth >= w.scrollWidth - 2);
    w.previousElementSibling.classList.toggle('show', can);
  }
  var all = function(){ document.querySelectorAll('.val-table-wrap').forEach(cue); };
  var q = false;
  var later = function(){ if(q) return; q = true; requestAnimationFrame(function(){ q = false; all(); }); };
  new MutationObserver(later).observe(document.body, {childList:true, subtree:true});
  window.addEventListener('resize', later);
  all();
})();

      body: (n.lede ? `<p class="rv-lede">${n.lede}</p>` : '') +
        `<div class="rv-grid">${Object.keys(n.kinds || {}).map(k => {
          const ks = names.filter(x => n.items[x].k === k);
          return ks.length ? `<div class="rv-grp"><span class="rv-k ${k}">${esc(n.kinds[k])}</span>
            <div class="sys">${ks.map(x => `<button type="button" data-sys-open="${esc(x)}" data-site="${site}">${SITE.flag(esc(x), n.items[x].flag)}</button>`).join('')}</div></div>` : '';
        }).join('')}</div>`
    });
  }
  container.addEventListener('click', e => {
    const ho = e.target.closest('[data-hm-only]');
    if(ho){ openHmOnly(ho.dataset.hmOnly); return; }
    const si = e.target.closest('[data-site-info]');
    if(si){ openSiteNote(si.dataset.siteInfo); return; }
    const card = e.target.closest('.card');
    if(card) SITE.openSystem(SITE.findSystem(card.dataset.name, card.dataset.site, card.dataset.area));
  });

  // ---- target state: every current system around the proposed solution, per site ----
  const T = L.target;
  document.getElementById('targetTitle').innerHTML = T.title || 'Target-state reference architecture, by site';
  document.getElementById('targetSub').innerHTML = T.sub || `One ${esc(D.meta.product)} instance per site, with every current system around it by business process.`;
  document.getElementById('targetTabs').innerHTML = D.sites.map((s, i) =>
    `<div class="target-tab${i === 0 ? ' active' : ''}" data-target-site="${s.key}">${esc(s.short || s.label)}</div>`).join('');
  document.getElementById('targetLegend').innerHTML = `
    <div class="item"><span class="swatch" style="background:var(--core)"></span>${esc(SITE.statusLabel('core'))}</div>
    <div class="item"><span class="swatch dashed"></span>${esc(SITE.statusLabel('extended'))}</div>
    <div class="item"><span class="swatch" style="background:var(--stays)"></span>${esc(SITE.statusLabel('stays'))}</div>
    <div class="item"><span class="badge-oos" style="position:relative;top:1px;"></span>already out of support today</div>`;

  const polar = (cx, cy, r, a) => [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  function arcPath(cx, cy, r, a0, a1){
    const [x0,y0] = polar(cx,cy,r,a0), [x1,y1] = polar(cx,cy,r,a1);
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${(a1 - a0) > Math.PI ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  function renderTarget(siteKey){
    const site = SITE.site(siteKey);
    // Systems grouped by business process, in the same order as the areas above.
    const groups = D.areas.map(a => ({area:a, items: SYS.filter(d => d.site === siteKey && d.area === a.key)})).filter(g => g.items.length);
    const n = groups.reduce((t,g) => t + g.items.length, 0), g = groups.length;
    const W = 1200, H = 1000, cx = W/2, cy = H/2, R = 380, ARC_R = 330, LBL_R = 296, GAP = 0.115, PAD = 0.8;
    const budget = 2*Math.PI - g*GAP, denom = n + PAD*g;
    const spans = groups.map(gr => budget * (gr.items.length + PAD) / denom);
    let cursor = -Math.PI/2 - (spans[0] || 0)/2;
    let lines = '', brackets = '', nodes = '';
    groups.forEach((gr, k) => {
      const span = spans[k], gStart = cursor, gEnd = cursor + span;
      cursor = gEnd + GAP;
      const mid = gStart + span/2, [lx, ly] = polar(cx, cy, LBL_R, mid);
      const code = gr.area.code || gr.area.title.slice(0, 10).toUpperCase();
      const showTitle = span * LBL_R > 95 && gr.area.code;
      const boxW = Math.max(code.length*6.6, showTitle ? gr.area.title.length*5.0 : 0) + 16, boxH = showTitle ? 30 : 19;
      const tick = a => { const [x0,y0] = polar(cx, cy, ARC_R-7, a), [x1,y1] = polar(cx, cy, ARC_R+7, a);
        return `<line class="grp-tick" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" />`; };
      brackets += `
        <path class="grp-arc" d="${arcPath(cx, cy, ARC_R, gStart, gEnd)}" />${tick(gStart)}${tick(gEnd)}
        <rect class="grp-chip" x="${(lx-boxW/2).toFixed(1)}" y="${(ly-boxH/2).toFixed(1)}" width="${boxW.toFixed(1)}" height="${boxH}" rx="3" />
        <text x="${lx.toFixed(1)}" y="${(ly + (showTitle ? -2 : 4)).toFixed(1)}" text-anchor="middle" class="grp-code">${esc(code)}</text>
        ${showTitle ? `<text x="${lx.toFixed(1)}" y="${(ly+10).toFixed(1)}" text-anchor="middle" class="grp-title">${esc(gr.area.title)}</text>` : ''}
        <title>${esc(SITE.areaLabel(gr.area.key))} &mdash; ${gr.items.length} system${gr.items.length>1?'s':''} today</title>`;
      gr.items.forEach((d, i) => {
        const angle = gStart + span * (i + 0.5) / gr.items.length, [x, y] = polar(cx, cy, R, angle);
        const color = STATUS_COLOR[d.status];
        const dash = d.status === 'extended' ? 'stroke-dasharray="7,6"' : '';
        const sw = d.status === 'core' ? 2.75 : d.status === 'extended' ? 1.75 : 1.25;
        lines += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${color}" stroke-width="${sw}" ${dash} opacity="0.75" />`;
        const right = Math.cos(angle) >= 0, anchor = right ? 'start' : 'end', dx = right ? 14 : -14;
        nodes += `
          <g class="node" data-name="${esc(d.name)}" data-site="${d.site}" data-area="${d.area}">
            <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" style="fill:${color};stroke:var(--bg)" stroke-width="1.5" />
            ${d.oos ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="none" style="stroke:var(--oos)" stroke-width="1.5" />` : ''}
            <text x="${(x + dx).toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="${anchor}" class="node-label">${esc(d.name)}${d.ext ? '  ⇄' : ''}</text>
            <text x="${(x + dx).toFixed(1)}" y="${(y + 11).toFixed(1)}" text-anchor="${anchor}" class="node-desc">${esc(d.desc)}</text>
            <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="transparent" />
            <title>${esc(d.name)} &mdash; ${esc(SITE.statusLabel(d.status))} &middot; ${esc(SITE.areaLabel(d.area))}${d.oos ? ' &middot; already out of support' : ''}${d.ext ? ' &middot; external interface today' : ''}</title>
          </g>`;
      });
    });
    const center = (T.center && T.center.length ? T.center : [D.meta.product]).slice(0, 2);
    const c1 = center.length === 2 ? -6 : 4;
    const svg = `
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        ${lines}${brackets}${nodes}
        <rect x="${cx-115}" y="${cy-38}" width="230" height="76" rx="6" style="fill:var(--core);stroke:var(--bg)" stroke-width="2" />
        <text x="${cx}" y="${cy + c1}" text-anchor="middle" class="center-label">${esc(center[0])}</text>
        ${center[1] ? `<text x="${cx}" y="${cy+13}" text-anchor="middle" class="center-label">${esc(center[1])}</text>` : ''}
        <text x="${cx}" y="${cy+29}" text-anchor="middle" class="center-sub">${esc(site.short || site.label)} &middot; target</text>
      </svg>`;
    // Phones get the same systems as a list: the ring's labels are unreadable at that size.
    const list = `<div class="target-list" aria-label="${esc(site.label)} systems by business process">
      ${groups.map(gr => `<div class="tl-group">
        <div class="tl-head">${gr.area.code ? `<span class="tl-code">${esc(gr.area.code)}</span>` : ''}${esc(gr.area.title)}</div>
        ${gr.items.map(d => `<button type="button" class="tl-item" data-status="${d.status}" data-name="${esc(d.name)}" data-site="${d.site}" data-area="${d.area}">
          <span class="tl-dot"></span><span class="tl-n">${SITE.flag(esc(d.name), d.flag)}${d.oos ? ' <span class="badge-oos" title="Already out of support"></span>' : ''}</span>
          <span class="tl-d">${esc(d.desc)}</span><span class="tl-s">${esc(SITE.statusLabel(d.status))}</span></button>`).join('')}
      </div>`).join('')}
    </div>`;
    document.getElementById('diagramHolder').innerHTML = svg + list;
  }
  document.querySelectorAll('.target-tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.target-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderTarget(tab.dataset.targetSite);
  }));
  document.getElementById('diagramHolder').addEventListener('click', e => {
    const g = e.target.closest('g.node, .tl-item');
    if(g) SITE.openSystem(SITE.findSystem(g.dataset.name, g.dataset.site, g.dataset.area));
  });

  applyFilter();
  if(D.sites.length) renderTarget(D.sites[0].key);
});

}};

  var cur = null, recorded = [], rec = null, sub = '';
  var add = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function(t, f, o){
    if(rec && (this === document || this === window)) rec.push([this, t, f, o]);
    return add.call(this, t, f, o);
  };
  var parse = function(){
    var m = /^#\/([A-Za-z0-9_]+)(?:~(.*))?$/.exec(location.hash);
    return {key: m && PAGE[m[1]] ? m[1] : 'home', sub: m && m[2] ? m[2] : ''};
  };
  window.SPA = {
    here: 'index.html',
    get hash(){ return sub ? '#' + sub : ''; },
    set: function(h){ var s = String(h).replace(/^#/, ''); sub = s; try { history.replaceState(null, '', '#/' + cur + (s ? '~' + s : '')); } catch(e) {} },
    go: function(href){
      var m = /^([^#]*)(#(.*))?$/.exec(href || ''); var key = FILES[m[1]]; if(!key) return;
      var next = '#/' + key + (m[3] ? '~' + m[3] : '');
      if(location.hash !== next) location.hash = next;
    }
  };
  var render = function(){
    var st = parse();
    recorded.forEach(function(r){ r[0].removeEventListener(r[1], r[2], r[3]); }); recorded = [];
    cur = st.key; sub = st.sub; SPA.here = KEYFILE[cur];
    var p = PAGE[cur];
    document.getElementById('pagestyle').textContent = p.style;
    var bd = document.body; bd.className = ''; ['data-filter','data-modal'].forEach(function(n){ bd.removeAttribute(n); });
    Object.keys(p.attrs).forEach(function(n){ bd.setAttribute(n, p.attrs[n] || ''); });
    document.getElementById('spa').innerHTML = p.markup;
    rec = [];
    try { SITE.renderNav(); SITE.initTheme(); p.fn(); }
    finally { recorded = rec; rec = null; }
    window.scrollTo(0, 0);
  };
  window.addEventListener('hashchange', function(){
    var st = parse();
    if(st.key !== cur) render(); else sub = st.sub;
  });
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(!a) return;
    var h = a.getAttribute('href') || '';
    var m = /^([^#]*)(#.*)?$/.exec(h);
    if(m && FILES[m[1]]){ e.preventDefault(); SPA.go(h); }
  }, true);
  render();
})();

</script>
</body>
